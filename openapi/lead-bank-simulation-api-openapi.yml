          description: ISO 8601 timestamp when the resolution occurred.
        resolved_by:
          $ref: '#/components/schemas/WireReturnRequestResolvedBy'
        rejection_reason:
          $ref: '#/components/schemas/WireReturnRequestRejectionReason'
        rejection_details:
          type: string
          description: Free-text explanation of the rejection. For incoming responses, includes the original 4-character ISO code.
          maxLength: 105
    WireChargeBearer:
      type: string
      description: Specifies which party bears the charges associated with the wire transfer.
      example: shared
      enum:
      - debtor
      - shared
      - creditor
    InstantPaymentParty:
      type: object
      description: Details of a party in an instant payment.
      required:
      - name
      - account_number
      properties:
        name:
          type: string
          description: The party's name.
          minLength: 3
          maxLength: 35
          example: Alex Smith
        account_number:
          type: string
          description: The party's account number.
          minLength: 1
          maxLength: 17
          example: '1234567890'
    InvalidParameterDetail:
      type: object
      properties:
        parameter:
          type: string
          description: Which parameter is invalid.
          example: transaction_type
        reason:
          type: string
          description: Why the parameter is invalid.
    IMAD:
      type: string
      description: Input Message Accountability Data (IMAD), a unique identifier available to originating and receiving banks of a wire message.
      example: 20241215MMQFMP2L017736
    IncomingInstantPaymentReturnRequestRejectionReason:
      type: string
      description: 'The reason for a rejected return request.

        * `account_closed` - Account closed

        * `non_sufficient_funds` - Insufficient funds

        * `customer_requested` - Customer decision

        * `legal_decision` - Legal decision

        * `customer_no_response` - No answer from customer

        * `returned_previously` - Already returned

        * `other` - Other'
      example: customer_no_response
      enum:
      - account_closed
      - non_sufficient_funds
      - customer_requested
      - legal_decision
      - customer_no_response
      - returned_previously
      - other
    DebtorAgent:
      type: object
      description: Details of the debtor agent financial institution.
      properties:
        routing_number:
          type: string
          description: Nine-character numeric ABA routing number for the debtor agent financial institution.
          minLength: 9
          maxLength: 9
          pattern: ^[0-9]+$
          example: '021000021'
    WireInstructAgent:
      type: object
      description: Wire instruct agent information.
      properties:
        name:
          type: string
          description: Name of the financial institution.
          example: Bank of America
        routing_number:
          type: string
          description: Nine-character numeric ABA routing number of the financial institution.
          example: '021000021'
        business_identifier_code:
          type: string
          description: Business Identifier Code (BIC) of the financial institution.
          minLength: 8
          maxLength: 11
          pattern: ^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$
          example: CHASUS33
    WireReturnRequestResolvedBy:
      type: string
      description: 'The party that resolved the return request.


        - `lead` — Resolved by Lead through validation or manual review.

        - `client` — Resolved by the partner via API or by initiating a return.

        - `counterparty` — Resolved by the counterparty financial institution''s response. Outgoing return requests only.'
      enum:
      - lead
      - client
      - counterparty
    SimulateWireDebtorRequestV2:
      type: object
      description: The party sending the wire.
      required:
      - name
      - account_identifier
      - address
      properties:
        name:
          type: string
          description: Name of the sending party.
          minLength: 1
          maxLength: 140
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
          example: Alex Smith
        account_identifier:
          type: object
          description: Account identifier of the sending party.
          required:
          - type
          - value
          properties:
            type:
              type: string
              description: Type of account identifier.
              enum:
              - account_number
              - iban
              example: account_number
            value:
              type: string
              description: Account identifier value of the sending party.
              minLength: 1
              maxLength: 34
              pattern: ^[a-zA-Z0-9 ]*[a-zA-Z0-9]+$
              example: '1032345678'
        address:
          $ref: '#/components/schemas/WirePostalAddressRequestV2'
          description: Postal address of the sending party.
    WireReturnRequestReason:
      type: string
      description: 'Reason for the return request.


        - `creditor_account_number_invalid` — ISO `AC03`. Wire was sent to the wrong account number.

        - `wrong_amount` — ISO `AM09`. Wire amount is not the agreed amount or expected.

        - `customer_requested` — ISO `CUST`. The partner''s end customer requested the return.

        - `duplication` — ISO `DUPL`. Duplicate wire sent.

        - `fraud_suspected` — ISO `FRAD`. Fraud suspected.

        - `narrative` — ISO `NARR`. Catch-all when no structured reason fits; details field carries the explanation.

        - `technical_problem` — ISO `TECH`. A technical issue caused the wire to be sent.

        - `undue_payment` — ISO `UPAY`. Payment was not due or for services not performed.

        - `per_agent_request` — ISO `AGNT`. Incoming only — Lead is the agent for outgoing payments.

        - `other` — Incoming only. Catch-all for unmapped ISO codes received from the counterparty.'
      enum:
      - creditor_account_number_invalid
      - wrong_amount
      - customer_requested
      - duplication
      - fraud_suspected
      - narrative
      - technical_problem
      - undue_payment
      - per_agent_request
      - other
    AccountNumberID:
      type: string
      description: The ID of the Lead Bank Account Number object.
      example: account_number_xyz123
      pattern: ^account_number_\w+$
    WireInstructAgentV2:
      type: object
      description: Wire instruct agent information.
      properties:
        name:
          type: string
          description: Name of the financial institution.
          example: Bank of America
        business_identifier_code:
          type: string
          description: Business Identifier Code (BIC) of the financial institution.
          minLength: 8
          maxLength: 11
          pattern: ^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$
          example: CHASUS33
        local_routing_identifier:
          $ref: '#/components/schemas/LocalRoutingIdentifier'
    CurrencyCode:
      description: A three-letter currency code as defined in ISO 4217.
      type: string
      example: USD
      enum:
      - USD
    WirePostalAddressRequestV2:
      type: object
      description: 'Hybrid ISO 20022 postal address. `country` and `town_name` are required; up to two

        unstructured lines plus the structured fields are otherwise optional.'
      required:
      - country
      - town_name
      properties:
        line_one:
          type: string
          description: Line one of the address in unstructured format.
          maxLength: 70
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
          example: 123 Main St
        line_two:
          type: string
          description: Line two of the address in unstructured format.
          maxLength: 70
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
          example: Suite 100
        town_name:
          type: string
          description: Name of a built-up area, with defined boundaries, and a local government.
          minLength: 1
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
          example: Kansas City
        country_sub_division:
          type: string
          description: Identifies a subdivision of a country such as a state, region, or county.
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
          example: MO
        post_code:
          type: string
          description: Identifier of letters and/or numbers added to a postal address to assist mail sorting.
          maxLength: 16
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
          example: '64105'
        country:
          type: string
          description: ISO 3166-1 alpha-2 code representing a nation with its own government.
          pattern: ^[A-Z]{2}$
          example: US
    SimulateWireDebtorRequest:
      type: object
      description: The person or entity sending the wire.
      required:
      - name
      - account_identifier
      - address
      properties:
        name:
          type: string
          description: Name of the person or entity sending the wire.
          minLength: 3
          maxLength: 35
          pattern: ^[ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*[\w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]][ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*$
          example: Allan Scott
        account_identifier:
          type: object
          description: Account identifier of the debtor.
          required:
          - type
          - value
          properties:
            type:
              type: string
              description: Indicator for the type of account identifier sending the wire.
              enum:
              - account_number
              example: account_number
            value:
              type: string
              description: The value associated with the account identifier sending the wire.
              minLength: 1
              maxLength: 17
              pattern: ^[a-zA-Z0-9 ]*[a-zA-Z0-9]+$
              example: '1032345678'
        address:
          description: Address of the debtor.
          $ref: '#/components/schemas/WirePostalAddress'
          required:
          - line_one
    WireCharges:
      type: object
      description: Information about charges associated with the wire transfer.
      properties:
        charge_bearer:
          $ref: '#/components/schemas/WireChargeBearer'
          description: Specifies which party bears the charges for the wire transfer.
        breakdown:
          type: array
          description: Itemized list of charges assessed during wire transfer processing.
          items:
            $ref: '#/components/schemas/WireChargeInfo'
    WireV1:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the wire object.
          example: wire_xyz123
          pattern: ^wire_\w+$
        account_id:
          $ref: '#/components/schemas/AccountID'
        account_number_id:
          $ref: '#/components/schemas/AccountNumberID'
        core_transaction_id:
          type:
          - string
          - 'null'
          description: Linked core transaction ID associated with the wire.
          example: core_transaction_xyz123
        created_at:
          type: string
          format: date-time
          description: ISO 8601 format timestamp representing when the wire object was created.
          example: '2024-06-27T11:22:33Z'
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 format timestamp representing when the wire object was last updated.
          example: '2024-06-27T11:22:33Z'
        settlement_date:
          type: string
          format: date
          description: The ISO-8601 Datestamp indicating the wire settlement date based on the Fedwire's business day definition.
          example: '2024-06-27'
        direction:
          $ref: '#/components/schemas/WireDirection'
        type:
          type: string
          description: Indicates the type of wire message that the object represents.
          example: transfer
          enum:
          - transfer
          - return
        status:
          $ref: '#/components/schemas/WireStatus'
        amounts:
          $ref: '#/components/schemas/WireAmounts'
        debtor:
          $ref: '#/components/schemas/WireParty'
          description: Details of the debtor sending funds.
        debtor_agent:
          $ref: '#/components/schemas/WireAgent'
          description: Details of the financial institution where the debtor (payer) holds their account. This object may be absent if the instructing agent does not provide this information.
        instructing_agent:
          $ref: '#/components/schemas/WireInstructAgent'
          description: The financial institution that transmitted the payment through Fedwire. In some cases, this may differ from the bank where the account is held. This object will always be populated.
        instructed_agent:
          $ref: '#/components/schemas/WireInstructAgent'
          description: The financial institution that received the payment through Fedwire. This may not always be the bank where the recipient's account is held. This object will always be populated.
        creditor_agent:
          $ref: '#/components/schemas/WireAgent'
          description: Details of the financial institution where the creditor (payee) holds their account. This object may be absent if the instructing agent does not provide this information.
        creditor:
          $ref: '#/components/schemas/WireParty'
          description: Details of the creditor receiving funds.
        ultimate_debtor:
          $ref: '#/components/schemas/WireParty'
          description: The ultimate party on whose behalf the payment is made, if different from the debtor.
        ultimate_creditor:
          $ref: '#/components/schemas/WireParty'
          description: The ultimate party to which the payment is intended, if different from the creditor.
        other_agents:
          $ref: '#/components/schemas/WireOtherAgents'
        payment_identifiers:
          $ref: '#/components/schemas/WirePaymentIdentifiers'
        remittance_details:
          $ref: '#/components/schemas/WireRemittanceDetails'
        charges:
          $ref: '#/components/schemas/WireCharges'
          description: Information about any charges assessed during wire transfer processing.
        related_wires:
          $ref: '#/components/schemas/RelatedWiresV1'
        return:
          $ref: '#/components/schemas/WireReturnV1'
        rejection:
          $ref: '#/components/schemas/WireRejectionReasonV1'
        return_requests:
          type: array
          description: Return requests associated with this wire.
          items:
            $ref: '#/components/schemas/WireReturnRequest'
        metadata:
          $ref: '#/components/schemas/Metadata'
    WireAgentV2:
      type: object
      description: Wire agent information.
      properties:
        business_identifier_code:
          type: string
          description: Business Identifier Code (BIC) of the financial institution.
          example: BOFAUS3NXXX
        name:
          type: string
          description: Name of the financial institution.
          example: Bank of America
        local_routing_identifier:
          $ref: '#/components/schemas/LocalRoutingIdentifier'
        address:
          description: Address of the financial institution.
          $ref: '#/components/schemas/WirePostalAddress'
    TransactionType:
      type: string
      description: ACH transaction type.
      example: credit
      enum:
      - credit
      - debit
    SimulateResponse:
      type: object
    WireReturnV2:
      type: object
      description: Return details associated with a returned wire.
      properties:
        reason:
          $ref: '#/components/schemas/WireReturnReasonEnum'
          description: 'If the wire is a return, this field indicates the reason for the return. When the return originates from a counterparty with an unmapped ISO code, this field is set to `other` and the raw ISO code is included in `additional_information` in the format "ISO Code: <code>; <details>".'
        additional_information:
          type: string
          description: 'If the return reason is `narrative`, an accompanying free-form explanation is required and will appear here. When the reason is `other`, this is populated with the raw ISO code in the format "ISO Code: <code>; <details>". For other reasons, participants may optionally send additional information as well.'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
