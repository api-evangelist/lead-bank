      - aggregate_limit_exceeded
    WireTransferPurposeV1:
      type: object
      description: The purpose or reason for which the wire is being sent.
      required:
      - type
      properties:
        type:
          description: Code representing the purpose of the transfer.
          type: string
          enum:
          - salary_payment
          - invoice_payment
          - gift
          - payment_for_goods
          - payment_for_services
          - insurance_premium_payment
          - interest_payment
          - loan
          - loan_repayment
          - account_management
          - cash_management_transfer
          - tax_payment
          - government_payment
          - benefits_payment
          - pension_payment
          - rent_payment
          - utilities_payment
          - education_payment
          - healthcare_payment
          - charitable_payment
          - refund
          - fee_payment
          - intercompany_transfer
          - investment_payment
          - fx_or_treasury
          - derivatives_payment
          - card_network_settlement
          - other
          example: invoice_payment
        other_details:
          type: string
          description: Free-formatted text for wire sender if `other` is selected for `type`.
          minLength: 3
          maxLength: 140
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
          example: Payment for consulting services
    InstantPaymentAgent:
      type: object
      description: Details of a financial institution in an instant payment.
      required:
      - routing_number
      properties:
        routing_number:
          type: string
