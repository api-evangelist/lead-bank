  /v2/simulate/card_network_settlements:
    post:
      tags:
      - Simulation
      operationId: simulate-a-network-settlement-v2
      summary: Simulate a Card Network Settlement
      description: Simulate a Card Network Settlement for your program, as if Lead received the settlement file from the network, and trigger the related downstream behavior. A Card Network Settlement cannot be created twice for the same settlement reporting ID, `settlement_date`, `currency_code`, and `card_network`. Available in Sandbox only.
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key
        required: true
        schema:
          type: string
          maxLength: 255
          minLength: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatedNetworkSettlement'
            example:
              settlement_reporting_id: '123456789'
              settlement_date: '2026-06-01'
              currency_code: USD
              card_network: visa
              network_settlement_amount_breakdown:
                transactions: 250000
                refunds: -5000
                interchange: -3000
                fees: 1200
                disputes: -800
      responses:
        '200':
          description: The card network settlement was accepted. The response echoes the settlement that was submitted; it is not the full Card Network Settlement record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatedNetworkSettlement'
              example:
                settlement_reporting_id: '123456789'
                settlement_date: '2026-06-01'
                currency_code: USD
                card_network: visa
                network_settlement_amount_breakdown:
                  transactions: 250000
                  refunds: -5000
                  interchange: -3000
                  fees: 1200
                  disputes: -800
        '400':
          description: The request could not be parsed (`request_malformed`), or the `Idempotency-Key` header is missing (`idempotency_key_missing`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: request_malformed
                message: The request is invalid and cannot be parsed by the server.
                errors:
                - code: payload_invalid
                  message: The request body is not valid JSON.
        '403':
          description: 'Rejected before the request reached the Receivable API. `code` is one of:

            `authentication_missing` (the request has no credentials),

            `token_invalid` (the bearer token is expired, invalid, or does not grant the required scope),

            `source_ip_not_permitted` (the request came from an IP address that is not on your program''s allowlist).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: authentication_missing
                message: The request has no authentication credentials. Send your API token in the Authorization header.
                errors:
                - code: authentication_missing
                  message: The Authorization header is missing. Send your API token as a bearer token.
                  parameters:
                  - Authorization
        '404':
          description: This endpoint is not available outside the Sandbox environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: object_not_found
                message: No object exists at the requested ID, or it is not visible to this caller.
        '409':
          description: A concurrent request with the same `Idempotency-Key` is still in flight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: idempotency_key_in_use
                message: A concurrent request using this Idempotency-Key is still in flight.
        '422':
          description: 'The request was parsed but cannot be processed. `code` is one of:

            `parameters_invalid` (a field is missing, malformed, or out of range; all failures returned at once),

            `related_object_invalid` (the `card_network` and `currency_code` combination does not match a network configured for your program),

            `object_state_conflict` (a network settlement already exists for this `settlement_reporting_id`, `card_network`, `settlement_date`, and `currency_code`),

            `idempotency_request_inconsistent` (this `Idempotency-Key` was used with a different request body).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: parameters_invalid
                message: One or more parameters are invalid.
                errors:
                - code: out_of_range
                  message: network_settlement_amount_breakdown.transactions must be greater than or equal to 0.
                  parameters:
                  - network_settlement_amount_breakdown.transactions
                - code: out_of_range
                  message: network_settlement_amount_breakdown.refunds must be less than or equal to 0.
                  parameters:
                  - network_settlement_amount_breakdown.refunds
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: rate_limit_exceeded
                message: You have exceeded the rate limit for this endpoint. Retry with backoff.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: internal_server_error
                message: An unexpected error occurred. Contact support with the Request-Id header value.
components:
  schemas:
    SimulateWireInstructingAgentRequest:
      type: object
      description: The financial institution that transmitted the payment to Lead.
      properties:
        local_routing_identifier:
          $ref: '#/components/schemas/LocalRoutingIdentifierRequest'
          description: Routing or transit code used to identify the instructing agent within a local clearing system.
    ErrorCode:
      type: string
      description: A snake_case code identifying the error family — the stable, machine-readable value partners branch on, together with the HTTP status.
      example: parameters_invalid
      enum:
      - request_malformed
      - content_too_large
      - idempotency_key_missing
      - authentication_missing
      - token_invalid
      - source_ip_not_allowed
      - url_invalid
      - object_not_found
      - method_not_allowed
      - idempotency_key_in_use
      - idempotency_request_inconsistent
      - rate_limit_exceeded
      - internal_server_error
      - service_unavailable
      - endpoint_disabled
      - gateway_timeout
      - unclassified
      - parameters_invalid
      - related_object_invalid
      - related_object_not_ready
      - related_object_conflict
      - limit_exceeded
      - client_control_restricted
      - lead_control_restricted
      - object_state_conflict
      - object_modified_concurrently
      - operation_invalid
    NetworkSettlementAmountBreakdown:
      type: object
      description: The gross and net components that make up a card network settlement, in minor units.
      required:
      - transactions
      - refunds
      - interchange
      - fees
      - disputes
      properties:
        transactions:
          type: integer
          description: Gross transactions that settled on the network — funds spent by cardholders, in aggregate, in minor units. For credit programs this is the amount that drives receivable creation.
          minimum: 0
          example: 250000
        refunds:
          type: integer
          description: Gross refunds that settled on the network — funds returned to cardholders, in aggregate, in minor units. Zero or negative.
          maximum: 0
          example: -5000
        interchange:
          type: integer
          description: Net interchange that settled on the network, in minor units. May be positive or negative.
          example: -3000
        fees:
          type: integer
          description: Net fees that settled on the network, in minor units. May be positive or negative.
          example: 1200
        disputes:
          type: integer
          description: Net disputes that settled on the network, in minor units. May be positive or negative.
          example: -800
    WireChargeInfo:
      type: object
      description: Details of a single charge assessed during wire transfer processing.
      required:
      - amount
      - currency_code
      properties:
        amount:
          type: string
          description: The amount of the charge.
          example: '12.50'
        currency_code:
          type: string
          description: ISO 4217 three-letter currency code for the charge.
          example: USD
        charging_agent:
          $ref: '#/components/schemas/WireAgent'
    APIError:
      type: object
      properties:
        code:
          type: string
          description: The error code.
        title:
          type: string
          description: The error title.
        detail:
          type: string
          description: A detailed error description.
        status:
          type: string
          description: The HTTP status code.
        invalid_parameters:
          type: array
          description: Invalid request parameters with reasons, if applicable.
          items:
            $ref: '#/components/schemas/InvalidParameterDetail'
        instance:
          type: string
          description: The object causing this specific occurrence of the error, if applicable.
    OutgoingInstantPaymentReturnReason:
      type: string
      description: 'The reason for initiating an return.

        * `honor_return_request` - Honoring a return request

        * `wrong_amount` - Wrong amount

        * `duplication` - Duplicate payment

        * `initiating_party_unrecognized` - Unknown sender

        * `fraud_suspected` - Fraud suspected

        * `undue_payment` - Unduly paid

        * `narrative` - Narrative reason, additional_information required

        * `customer_requested` - Requested by customer'
      example: duplication
      enum:
      - honor_return_request
      - wrong_amount
      - duplication
      - initiating_party_unrecognized
      - fraud_suspected
      - undue_payment
      - narrative
      - customer_requested
    SimulateIncomingWireRequest:
      type: object
      description: Request body to simulate an incoming wire.
      required:
      - amount
      - creditor_account_number_id
      - debtor
      - debtor_agent
      properties:
        amount:
          $ref: '#/components/schemas/WireAmount'
        creditor_account_number_id:
          $ref: '#/components/schemas/AccountNumberID'
          description: The ID of the creditor account number associated with the wire.
        debtor:
          $ref: '#/components/schemas/SimulateWireDebtorRequest'
          description: Details of the debtor sending funds.
        remittance_details:
          type: object
          description: Details of the remittance information for the wire.
          properties:
            message_to_creditor:
              type: string
              description: Information intended specifically for the creditor.
              example: Payment for invoice 12345
              maxLength: 140
              pattern: ^[ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*$
        payment_identifiers:
          type: object
          description: Payment identifiers for the wire.
          properties:
            end_to_end_identification:
              type: string
              description: Unique identification that the initiating party in a wire message can use to unambiguously identify the transaction. This is passed through, unchanged, throughout the entire wire chain.
              maxLength: 35
              pattern: ^[ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*$
              example: EndtoEnd12345
        debtor_agent:
          $ref: '#/components/schemas/DebtorAgent'
          description: Debtor Agent financial institution details.
    WireReturnRequest:
      type: object
      description: A return request associated with a wire.
      required:
      - created_at
      - status
      - reason
      properties:
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the return request was created.
          example: '2024-06-27T12:15:00Z'
        status:
          $ref: '#/components/schemas/WireReturnRequestStatus'
        reason:
          $ref: '#/components/schemas/WireReturnRequestReason'
        details:
          type: string
          description: Details of the reason for the return request including the 4-character ISO code when possible.
          maxLength: 1000
          example: suspected unauthorized activity
        deadline:
          type: string
          format: date-time
          description: 'The deadline by which a final response to the return request is expected.

            For incoming return requests, you must respond by 11:30PM ET on the 10th business day. If you do not respond, we will respond on your behalf with a rejection at midnight.

            For outgoing return requests, this field will not be populated.'
          example: '2024-07-08T23:30:00Z'
        resolution:
          $ref: '#/components/schemas/WireReturnRequestResolution'
    InstantPaymentAmount:
      description: The amount of the instant payment in cents.
      type: integer
      format: int64
      example: 5000
      minimum: 0
    WireParty:
      type: object
      description: Wire party information.
      properties:
        name:
          type: string
          description: Name of the party.
          example: Alan Scott
        account_identifier:
          $ref: '#/components/schemas/WirePartyAccountIdentifier'
        address:
          description: Address of the party.
          $ref: '#/components/schemas/WirePostalAddress'
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: A human-readable description of the error family. Identical for every occurrence of a given `code`; carries no request-specific detail.
          example: One or more parameters are invalid.
        errors:
          type: array
          description: Zero or more specific errors within this family. Always present for validation errors, one entry per failing field.
          items:
            $ref: '#/components/schemas/ErrorItem'
    SimulateIncomingWireRequestV2:
      type: object
      description: 'Request body to simulate an incoming wire in sandbox. The corridor is inferred from the

        shape of `debtor_agent` rather than an explicit field, matching how Lead derives the

        corridor from the ISO 20022 payload on real incoming wires: a `business_identifier_code`

        with a non-US country code produces an international wire, while providing only

        `local_routing_identifier` produces a domestic wire.'
      required:
      - amount
      - creditor_account_number_id
      - debtor
      - debtor_agent
      properties:
        amount:
          $ref: '#/components/schemas/WireAmount'
          description: Wire amount in USD cents.
        creditor_account_number_id:
          $ref: '#/components/schemas/AccountNumberID'
          description: The ID of the account number that will receive the simulated wire.
        debtor:
          $ref: '#/components/schemas/SimulateWireDebtorRequestV2'
          description: The party sending the wire.
        debtor_agent:
          $ref: '#/components/schemas/SimulateWireDebtorAgentRequest'
          description: The debtor's financial institution.
        instructing_agent:
          $ref: '#/components/schemas/SimulateWireInstructingAgentRequest'
          description: The financial institution that transmitted the payment to Lead.
        remittance_details:
          type: object
          description: Details of the remittance information for the wire.
          properties:
            message_to_creditor:
              type: string
              description: Information intended specifically for the creditor.
              example: Payment for invoice 12345
              maxLength: 140
              pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
        payment_identifiers:
          type: object
          description: Payment identifiers for the wire.
          properties:
            end_to_end_identification:
              type: string
              description: Unique identification that the initiating party in a wire message can use to unambiguously identify the transaction. This is passed through, unchanged, throughout the entire wire chain.
              maxLength: 35
              pattern: ^[ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*$
              example: EndtoEnd12345
    AccountID:
      type: string
      description: The ID of the Account object.
      example: account_xyz123
      pattern: ^account_\w+$
    WireReturnReasonV2:
      type: string
      description: The reason for returning the wire.
      example: creditor_request
      enum:
      - account_blocked
      - wrong_amount
      - creditor_name_mismatch
      - honor_return_request
      - fraud_suspected
      - creditor_request
      - narrative
      - missing_debtor_data
      - missing_creditor_data
    WireReturnCode:
      type: string
      description: 'List of eligible return reason codes for wire transfers.

        * `AC06` - account_blocked

        * `AM09` - wrong_amount

        * `BE01` - creditor_name_mismatch

        * `FOCR` - honor_return_request

        * `FR01` - fraud_suspected

        * `MS02` - creditor_request

        * `NARR` - narrative

        * `RR02` - missing_debtor_data

        * `RR03` - missing_creditor_data'
      example: AC06
      enum:
      - AC06
      - AM09
      - BE01
      - FOCR
      - FR01
      - MS02
      - NARR
      - RR02
      - RR03
    SenderCompanyID:
      type: string
      description: The company id of the sender. Maximum number of characters is 10.
      example: 1234567890
    WireAmount:
      description: The amount of the wire transaction in cents.
      type: integer
      format: int64
      example: 5000
      minimum: 1
      maximum: 990000000000
    WireChargeInfoV2:
      type: object
      description: Details of a single charge assessed during wire transfer processing.
      required:
      - amount
      - currency_code
      properties:
        amount:
          type: string
          description: The amount of the charge.
          example: '12.50'
        currency_code:
          type: string
          description: ISO 4217 three-letter currency code for the charge.
          example: USD
        charging_agent:
          $ref: '#/components/schemas/WireAgentV2'
    ReceivableCardNetwork:
      type: string
      description: The card network the settlement came from.
      enum:
      - visa
      - mastercard
      - pulse
      - accel
      - maestro
      - tabapay
      - amex
      - star
      - interlink
      example: visa
    WireAmounts:
      type: object
      properties:
        settlement_amount:
          $ref: '#/components/schemas/WireAmount'
          description: Amount of money that moved across the Fedwire network from the instructing agent to the instructed agent.
        settlement_currency_code:
          $ref: '#/components/schemas/CurrencyCode'
          description: The currency code of the settlement amount.
        instructed_amount:
          $ref: '#/components/schemas/WireAmount'
          description: Amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party.
        instructed_currency_code:
          type: string
          description: The currency code of the instructed amount. A three-letter currency code as defined in ISO 4217.
        instructed_to_settlement_exchange_rate:
          description: Factor used to convert an amount from the instructed currency to the settlement currency.
          type: string
          example: 1
    WireRemittanceDetails:
      type: object
      description: Wire remittance details.
      properties:
        payment_notification:
          type: string
          readOnly: true
          description: Information about the payment notification.
          example: ba77ae30-efb8-4139-8e51-37e3fd905b2b
        message_to_creditor:
          type: string
          description: Information intended specifically for the creditor.
          example: Payment for invoice 12345
          maxLength: 140
          pattern: ^[ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]\n]*$
        message_to_receiving_fi:
          type: string
          readOnly: true
          description: Information intended specifically for the receiving financial institution.
          example: message for receiving financial institution
        fi_to_fi_message:
          type: string
          readOnly: true
          description: Financial institution to financial institution information, most often used by a financial institution to explain additional detail of a wire.
          example: message from financial institution to financial institution
        transfer_purpose:
          $ref: '#/components/schemas/WireTransferPurposeV1'
    WireChargesV2:
      type: object
      description: Information about charges associated with the wire transfer.
      properties:
        charge_bearer:
          $ref: '#/components/schemas/WireChargeBearer'
          description: Specifies which party bears the charges for the wire transfer.
        breakdown:
          type: array
          description: Itemized list of charges assessed during wire transfer processing.
          items:
            $ref: '#/components/schemas/WireChargeInfoV2'
    WireRejectionReasonV1:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/WireRejectionReasonEnum'
          description: If a wire is rejected, this field will indicate the reason for the rejection.
        additional_information:
          type: string
          description: If the rejection reason is “narrative”, then an accompanying free-form explanation is required and will appear here. For other reasons, participants may optionally send additional information as well.
        message_identification:
          $ref: '#/components/schemas/IMAD'
          description: If Lead rejected an incoming wire on your behalf, this field contains the message identification (formerly known as imad) of the return wire that we sent.
    OutgoingSecCode:
      type: string
      description: 'The Standard Entry Class, SEC, to code the outgoing ACH.

        Lead currently supports:

        * `CCD`: Corporate payment

        * `PPD`: Written authorization to initiate payment

        * `TEL`: Telephone initiated payment

        * `WEB`: Web initiated payment

        * `CIE`: Customer initiated entry

        '
      example: WEB
      enum:
      - CCD
      - PPD
      - TEL
      - WEB
      - CIE
    WireOtherAgentsV2:
      description: Details of any other agents involved in the wire transfer.
      type: object
