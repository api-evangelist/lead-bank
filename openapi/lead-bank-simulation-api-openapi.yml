openapi: 3.2.0
info:
  title: Lead Bank Simulation API
  description: Lead Bank's APIs
  version: v1.0
servers:
- url: https://api.sandbox.lead.bank
- url: https://api.lead.bank
security:
- bearerAuth: []
tags:
- name: Simulation
paths:
  /v1/simulate/ach/incoming_ach:
    post:
      tags:
      - Simulation
      operationId: simulate-incoming-ach
      summary: Simulate Incoming ACH
      description: Simulate an incoming ACH.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account_number_id
              - sec_code
              - transaction_type
              - amount
              - currency_code
              - statement_descriptor
              - sender_name
              - sender_company_id
              - sender_routing_number
              properties:
                amount:
                  $ref: '#/components/schemas/Amount'
                currency_code:
                  $ref: '#/components/schemas/CurrencyCode'
                transaction_type:
                  $ref: '#/components/schemas/TransactionType'
                account_number_id:
                  $ref: '#/components/schemas/AccountNumberID'
                sec_code:
                  $ref: '#/components/schemas/OutgoingSecCode'
                statement_descriptor:
                  $ref: '#/components/schemas/StatementDescriptor'
                sender_name:
                  $ref: '#/components/schemas/SenderName'
                sender_company_id:
                  $ref: '#/components/schemas/SenderCompanyID'
                sender_routing_number:
                  $ref: '#/components/schemas/SenderRoutingNumber'
      responses:
        '200':
          description: Incoming ACH object created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateResponse'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: We couldn't parse your request body, please check that your request body is valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/simulate/ach/{ach_id}/incoming_return:
    post:
      tags:
      - Simulation
      operationId: simulate-incoming-return
      summary: Simulate Incoming Return
      description: Simulate an incoming Return.
      parameters:
      - name: ach_id
        description: ID of the ACH object you want to return.
        example: ach_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^ach_\w+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - return_code
              properties:
                return_code:
                  $ref: '#/components/schemas/ReturnCode'
                return_additional_information:
                  type: string
                  description: Additional information to be added to the return.
      responses:
        '200':
          description: ACH return created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateResponse'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: We couldn't parse your request body, please check that your request body is valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/simulate/ach/{ach_id}/advance:
    post:
      tags:
      - Simulation
      operationId: simulate-advance-ach
      summary: Advance Sandbox ACH
      description: Advance an ACH in Sandbox.
      parameters:
      - name: ach_id
        description: ID of the ACH object you want to advance.
        example: ach_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^ach_\w+$
      responses:
        '200':
          description: ACH Object advanced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateResponse'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: We couldn't parse your request body, please check that your request body is valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/simulate/wires/{wire_id}/advance:
    post:
      tags:
      - Simulation
      operationId: simulate-advance-wire
      summary: Advance Sandbox Wire
      description: Advance a Wire in Sandbox.
      parameters:
      - name: wire_id
        description: ID of the Wire object you want to advance.
        example: wire_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^wire_\w+$
      responses:
        '200':
          description: Wire Object advanced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateResponse'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: wire_id passed in is not a valid wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: We couldn't parse your request body, please check that your request body is valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/simulate/wires/incoming:
    post:
      tags:
      - Simulation
      operationId: simulate-incoming-wire
      summary: Simulate Incoming Wire
      description: Simulate an incoming Wire.
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key
        required: true
        schema:
          type: string
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateIncomingWireRequest'
      responses:
        '200':
          description: Incoming Wire object created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateResponse'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: We couldn't parse your request body, please check that your request body is valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/simulate/wires/{wire_id}/incoming_return:
    post:
      tags:
      - Simulation
      operationId: simulate-incoming-wire-return
      summary: Simulate Incoming Wire Return
      description: Simulate an incoming Wire Return.
      parameters:
      - name: wire_id
        description: ID of the Wire object you want to return.
        example: wire_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^wire_\w+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - return_code
              properties:
                amount:
                  $ref: '#/components/schemas/WireAmount'
                  description: The amount to be returned in USD. Amount of the wire should be in currency's minor units.
                return_code:
                  $ref: '#/components/schemas/WireReturnCode'
                return_additional_information:
                  type: string
                  description: Additional details about why the wire is being returned that will be included with the returned wire.
                  minLength: 1
                  maxLength: 105
                  pattern: ^[ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*[\w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]][ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*$
      responses:
        '200':
          description: Wire return object created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateResponse'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: wire_id passed in is not a valid wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: We couldn't parse your request body, please check that your request body is valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/simulate/wires/{wire_id}/incoming_return_request:
    post:
      tags:
      - Simulation
      operationId: simulate-incoming-return-request
      summary: Simulate Incoming Wire Return Request
      description: Simulate an incoming wire return request.
      parameters:
      - name: wire_id
        description: ID of the outgoing wire you want to simulate an incoming return request against.
        example: wire_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^wire_\w+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  $ref: '#/components/schemas/WireReturnRequestReason'
                additional_information:
                  type: string
                  description: Free-text explanation included with the simulated request.
                  maxLength: 105
      responses:
        '200':
          description: The updated wire object, now containing the new return request entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireV1'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: wire_id passed in is not a valid wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: Your request parameters did not validate. The wire must be an outgoing wire eligible for receiving a return request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/simulate/wires/{wire_id}/incoming_return_request_rejection:
    post:
      tags:
      - Simulation
      operationId: simulate-incoming-return-request-rejection
      summary: Simulate Incoming Wire Return Request Rejection
      description: Simulate an incoming wire return request rejection.
      parameters:
      - name: wire_id
        description: ID of the wire whose outgoing return request you want to simulate a rejection of.
        example: wire_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^wire_\w+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  $ref: '#/components/schemas/WireReturnRequestRejectionReason'
                additional_information:
                  type: string
                  description: Free-text explanation included with the simulated rejection.
                  maxLength: 105
      responses:
        '200':
          description: The updated wire object, with the outgoing return request now in `rejected` status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireV1'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: wire_id passed in is not a valid wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: No active outgoing return request found on this wire, or other validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/simulate/wires/{wire_id}/incoming_return_request_acceptance:
    post:
      tags:
      - Simulation
      operationId: simulate-incoming-return-request-acceptance
      summary: Simulate Incoming Wire Return Request Acceptance
      description: Simulate an incoming wire return request acceptance.
      parameters:
      - name: wire_id
        description: ID of the wire whose outgoing return request you want to simulate an acceptance of.
        example: wire_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^wire_\w+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              - currency_code
              properties:
                amount:
                  $ref: '#/components/schemas/WireAmount'
                  description: Amount to be returned, in the currency's minor units. Must be greater than zero and not exceed the original wire amount.
                currency_code:
                  $ref: '#/components/schemas/CurrencyCode'
      responses:
        '200':
          description: The updated wire object, with the outgoing return request now in `accepted` status and a return wire credited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireV1'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: wire_id passed in is not a valid wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: No active outgoing return request found, amount exceeds wire amount, or other validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v2/simulate/wires/incoming:
    post:
      tags:
      - Simulation
      operationId: simulate-incoming-wire-v2
      summary: Simulate Incoming Wire V2
      description: Simulates an incoming wire against a creditor account in sandbox. Automatically advances to posted on creation; no call to advance required.
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key
        required: true
        schema:
          type: string
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateIncomingWireRequestV2'
      responses:
        '200':
          description: Incoming wire object created. The response body is empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateResponse'
        '422':
          description: 'Your request parameters did not validate. Field-level detail is returned, including CPMI

            character set violations, a US BIC on `debtor_agent.business_identifier_code`, neither

            routing field present on `debtor_agent`, or an invalid nine-digit ABA on

            `debtor_agent.local_routing_identifier.value` or `instructing_agent.local_routing_identifier.value`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v2/simulate/wires/{wire_id}/incoming_return:
    post:
      tags:
      - Simulation
      operationId: simulate-incoming-wire-return-v2
      summary: Simulate Incoming Wire Return V2
      description: Simulates an incoming return wire against an outgoing wire in sandbox. Automatically advances to posted on creation.
      parameters:
      - name: wire_id
        description: ID of the outgoing wire (or outgoing return wire) you want to return.
        example: wire_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^wire_\w+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                amount:
                  $ref: '#/components/schemas/WireAmount'
                  description: Amount to return in USD cents.
                reason:
                  $ref: '#/components/schemas/WireReturnReasonV2'
                  description: Return reason code.
                return_additional_information:
                  type: string
                  description: Additional details about why the wire is being returned.
                  minLength: 1
                  maxLength: 105
                  pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
      responses:
        '200':
          description: Incoming wire return object created. The response body is empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateResponse'
        '400':
          description: wire_id is not in a valid state to be returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: 'Your request parameters did not validate. Field-level detail is returned, including CPMI

            character set violations and a missing `return_additional_information` when `reason` is

            `narrative`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v2/simulate/wires/{wire_id}/incoming_return_request:
    post:
      tags:
      - Simulation
      operationId: simulate-incoming-return-request-v2
      summary: Simulate Incoming Wire Return Request V2
      description: Simulate an incoming wire return request.
      parameters:
      - name: wire_id
        description: ID of the outgoing wire you want to simulate an incoming return request against.
        example: wire_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^wire_\w+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  $ref: '#/components/schemas/WireReturnRequestReason'
                additional_information:
                  type: string
                  description: Free-text explanation included with the simulated request.
                  minLength: 1
                  maxLength: 105
                  pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
      responses:
        '200':
          description: The updated wire object, now containing the new return request entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireV2'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: wire_id passed in is not a valid wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: Your request parameters did not validate. The wire must be an outgoing wire eligible for receiving a return request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v2/simulate/wires/{wire_id}/incoming_return_request_rejection:
    post:
      tags:
      - Simulation
      operationId: simulate-incoming-return-request-rejection-v2
      summary: Simulate Incoming Wire Return Request Rejection V2
      description: Simulate an incoming wire return request rejection.
      parameters:
      - name: wire_id
        description: ID of the wire whose outgoing return request you want to simulate a rejection of.
        example: wire_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^wire_\w+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  $ref: '#/components/schemas/WireReturnRequestRejectionReason'
                additional_information:
                  type: string
                  description: Free-text explanation included with the simulated rejection.
                  minLength: 1
                  maxLength: 105
                  pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
      responses:
        '200':
          description: The updated wire object, with the outgoing return request now in `rejected` status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireV2'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: wire_id passed in is not a valid wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: No active outgoing return request found on this wire, or other validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v2/simulate/wires/{wire_id}/incoming_return_request_acceptance:
    post:
      tags:
      - Simulation
      operationId: simulate-incoming-return-request-acceptance-v2
      summary: Simulate Incoming Wire Return Request Acceptance V2
      description: Simulate an incoming wire return request acceptance.
      parameters:
      - name: wire_id
        description: ID of the wire whose outgoing return request you want to simulate an acceptance of.
        example: wire_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^wire_\w+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  $ref: '#/components/schemas/WireAmount'
                  description: Amount to be returned, in the currency's minor units. Must be greater than zero and not exceed the original wire amount. Defaults to the original wire's full amount when omitted.
      responses:
        '200':
          description: The updated wire object, with the outgoing return request now in `accepted` status and a return wire credited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireV2'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: wire_id passed in is not a valid wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: No active outgoing return request found, amount exceeds wire amount, or other validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v2/simulate/wires/{wire_id}/advance:
    post:
      tags:
      - Simulation
      operationId: simulate-advance-wire-v2
      summary: Advance Sandbox Wire V2
      description: Advance a Wire in Sandbox.
      parameters:
      - name: wire_id
        description: ID of the wire object you want to advance.
        example: wire_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^wire_\w+$
      responses:
        '200':
          description: Wire object advanced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateResponse'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: wire_id passed in is not a valid wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: We couldn't parse your request body, please check that your request body is valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/simulate/instant_payments/incoming:
    post:
      tags:
      - Simulation
      operationId: simulate-incoming-instant-payment
      summary: Simulate Incoming Instant Payment
      description: Simulate an incoming instant payment.
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key
        required: true
        schema:
          type: string
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - creditor_account_number_id
              - amount
              - currency_code
              - debtor
              - debtor_agent
              properties:
                creditor_account_number_id:
                  $ref: '#/components/schemas/AccountNumberID'
                  description: The ID of the Account Number object receiving the instant payment.
                amount:
                  $ref: '#/components/schemas/InstantPaymentAmount'
                  description: The amount of the instant payment in cents.
                currency_code:
                  $ref: '#/components/schemas/CurrencyCode'
                  description: A three-letter currency code as defined in ISO 4217. Only USD is supported.
                description:
                  type: string
                  maxLength: 140
                  description: Free-form information on the reason for the payment.
                  example: Payment for invoice 12345
                debtor:
                  $ref: '#/components/schemas/InstantPaymentParty'
                  description: The details of the debtor (payer) sending the funds.
                debtor_agent:
                  $ref: '#/components/schemas/InstantPaymentAgent'
                  description: The details of the financial institution where the debtor (payer) holds their account.
                payment_identifiers:
                  type: object
                  description: Optional payment identifiers.
                  properties:
                    end_to_end_id:
                      type: string
                      description: The identifier assigned by the party initiating the instant payment to be delivered to the customer unchanged.
                      maxLength: 35
                      example: E2E-20240101-001
      responses:
        '200':
          description: Intentionally empty - incoming instant payment will be created asynchronously.
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: We couldn't process your request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/simulate/instant_payments/{instant_payment_id}/incoming_return:
    post:
      tags:
      - Simulation
