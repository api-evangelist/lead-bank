    LeadEntityResponse:
      title: Lead
      type: object
      description: 'A `lead` entity. Lead provisions it during onboarding, and it holds your program''s core accounts. It is read only: a `POST` with this type returns `422 parameters_invalid`, and a `PATCH` returns `422 operation_invalid`. It carries no KYC, OFAC, risk score, identification, documents, or linked entities. `account_holder` is always `eligible`; the other three relationship types are always `ineligible`, because only individuals can hold them.'
      required:
      - id
      - type
      - business_details
      - eligibility
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/EntityID'
        type:
          $ref: '#/components/schemas/EntityTypeLead'
        business_details:
          $ref: '#/components/schemas/LeadPartnerBusinessDetails'
        eligibility:
          $ref: '#/components/schemas/EligibilityV2'
        metadata:
          $ref: '#/components/schemas/Metadata'
        created_at:
          type: string
          format: date-time
          description: Timestamp at which the entity object is created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp at which the entity object was last updated.
      example:
        id: entity_3XkTBcRw5nYs1LvKqM7hZjDp0Ug
        type: lead
        business_details:
          name: Example Fintech Inc.
          doing_business_as: Example
          address_details:
            physical_address:
              line_1: 100 Example St
              city: New York
              state: NY
              postal_code: '10006'
              country: US
        eligibility:
          account_holder:
            status: eligible
            failed_checks: []
          minor_account_holder:
            status: ineligible
            failed_checks:
            - check: check_individual_entity
              entity_id: entity_3XkTBcRw5nYs1LvKqM7hZjDp0Ug
              reason: Only individual entities can hold this relationship type.
          authorized_signer:
            status: ineligible
            failed_checks:
            - check: check_individual_entity
              entity_id: entity_3XkTBcRw5nYs1LvKqM7hZjDp0Ug
              reason: Only individual entities can hold this relationship type.
          authorized_user:
            status: ineligible
            failed_checks:
            - check: check_individual_entity
              entity_id: entity_3XkTBcRw5nYs1LvKqM7hZjDp0Ug
              reason: Only individual entities can hold this relationship type.
        metadata: {}
        created_at: '2026-08-10T00:00:00Z'
        updated_at: '2026-08-10T00:00:00Z'
