        - For `individual` entity, possible types are: `drivers_license`, `state_or_provincial_id`, `passport`, `permanent_residency_id`, `military_id`, `national_id`, `matriculate_id`, `other`. Note that `national_id` and `matriculate_id` are not applicable for `us_entity`.

        - For `business` entity, possible types are: `tax_certificate`, `tax_returns`, `partnership_agreement`, `certificate_of_good_standing`, `formation_document`, `proof_of_place_on_stock_exchange`, `other`.

        - For `sole_prop` entity, possible types are: `tax_certificate`, `tax_returns`, `name_certificate`, `drivers_license`, `state_or_provincial_id`, `passport`, `permanent_residency_id`, `military_id`, `national_id`, `matriculate_id`, `other`. Note that `national_id` and `matriculate_id` are not applicable for `us_entity`.

        '
    EligibilityFailedCheck:
      type: object
      required:
      - check
      - entity_id
      - reason
      properties:
        check:
          type: string
          example: check_kyc_status
          description: 'The name of the failing check. The same names appear in `422` errors for a failed `intended_eligibility` assertion. Lead may add checks, so handle names you do not recognize. Current checks:

            - Identity and contact: `check_first_name`, `check_last_name`, `check_date_of_birth`, `check_date_of_birth_missing`, `check_date_of_birth_below_minimum`, `check_date_of_birth_above_maximum`, `check_phone_or_email`, `check_physical_address`, `check_government_id`.

            - Business: `check_business_name`, `check_business_type`, `check_business_industry`, `check_control_person_exists`, `check_child_entity_not_found`.

            - Screening and risk: `check_kyc_status`, `check_ofac`, `check_risk_score`, `check_manual_review_status` (a manual review of the entity is pending).

            - Relationship type: `check_individual_entity` (only individuals can hold `minor_account_holder`, `authorized_signer`, and `authorized_user`), `check_minor_account_holder_enabled` (your program is not approved for minor account holders).

            - Stored data: `invalid_entity` (the entity''s stored data fails Lead''s current validations, which can happen to an older entity when rules change).


            See [Eligibility](https://docs.lead.bank/v2/products/entity/eligibility).'
        entity_id:
          $ref: '#/components/schemas/EntityID'
          description: The entity whose data failed the check. A business or sole proprietorship fails when a linked individual fails, and the check then points at that individual's `entity_id`.
        reason:
          type: string
          example: KYC must be passed. Update kyc_details.result and kyc_details.screened_at on entity_xyz123.
          description: A human-readable explanation of the failure and how to fix it. Not part of the API contract, so do not parse it. It may change without notice.
