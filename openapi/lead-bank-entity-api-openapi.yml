        ofac_details:
          $ref: '#/components/schemas/OfacDetails'
        kyc_details:
          $ref: '#/components/schemas/KycDetails'
        credit_details:
          type: array
          items:
            $ref: '#/components/schemas/CreditDetails'
        metadata:
          $ref: '#/components/schemas/Metadata'
    DocumentFileID:
      type: string
      pattern: ^file_\w+$
      description: A file ID from `POST /v2/files`. The file must exist, belong to your program, and have a type this entry accepts. Each file can appear at most once on an entity.
