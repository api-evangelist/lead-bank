openapi: 3.2.0
info:
  title: Lead Bank Entity API
  description: Lead Bank's APIs
  version: v1.0
servers:
- url: https://api.sandbox.lead.bank
- url: https://api.lead.bank
security:
- bearerAuth: []
tags:
- name: Entity
paths:
  /v0/entities:
    post:
      tags:
      - Entity
      operationId: create-an-entity
      summary: Create an entity
      description: Create an Individual, Sole Prop or Business Entity.
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key
        required: true
        schema:
          type: string
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnEntityRequestBody'
      responses:
        '200':
          description: Entity object created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnEntitySuccessResponse'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '409':
          description: An entity with the same client_customer_id already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: We couldn't parse your request body, please check that your request body is valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Too many requests. Please slow down your request rate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Server error. Please try your request again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '503':
          description: Service unavailable. Please try your request again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    get:
      tags:
      - Entity
      operationId: retrieve-an-entity-by-client-customer-id
      summary: Retrieve an entity by client customer id
      description: Retrieve an entity by the client customer id
      parameters:
      - name: client_customer_id
        in: query
        required: true
        description: Client Customer ID of the entity object you want to retrieve.
        schema:
          type: string
      responses:
        '200':
          description: An entity object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAnEntitySuccessResponse'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: id passed in doesn't correspond to an entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Too many requests. Please slow down your request rate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Server error. Please try your request again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '503':
          description: Service unavailable. Please try your request again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v0/entities/{id}:
    patch:
      tags:
      - Entity
      operationId: Update-an-entity
      summary: Update an entity
      description: 'Certain updates on Entity trigger KYC re-screening, requiring an updated kyc_details.result and kyc_details.screened_at.


        For individual entities, KYC re-screening is triggered by changes to: first name, last name, date of birth, tax ID value, switching between `us_entity` and `non_us_entity` when that adds or removes a tax ID, and an existing identification document (for non-US entities). The requirement applies only when kyc_details has previously been submitted for the entity, and the new kyc_details.screened_at must be later than the previous one.


        For business and sole proprietorship entities, KYC re-screening is triggered by changes to: business name, business type, tax ID (US entities), and existing identification document (non-US entities).


        Note: Business and sole proprietors cannot switch between US and non-US entities. A new entity must be created in such case.'
      parameters:
      - name: id
        in: path
        required: true
        description: Entity ID
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        description: Idempotency key
        required: true
        schema:
          type: string
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnEntityRequestBody'
      responses:
        '200':
          description: Entity object updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAnEntitySuccessResponse'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: id passed in doesn't correspond to an entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '409':
          description: A request to update this entity is already in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: We couldn't parse your request body, please check that your request body is valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Too many requests. Please slow down your request rate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Server error. Please try your request again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '503':
          description: Service unavailable. Please try your request again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    get:
      tags:
      - Entity
      operationId: retrieve-an-entity-by-entity-id
      summary: Retrieve an entity by entity id
      parameters:
      - name: id
        in: path
        required: true
        description: Entity ID of the entity object you want to retrieve.
        schema:
          type: string
      responses:
        '200':
          description: An entity object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAnEntitySuccessResponse'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: id passed in doesn't correspond to an entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Too many requests. Please slow down your request rate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Server error. Please try your request again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '503':
          description: Service unavailable. Please try your request again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v2/entities:
    post:
      tags:
      - Entity
      operationId: create-an-entity-v2
      summary: Create an entity
      description: 'Create an `individual`, `business`, or `sole_prop` Entity. `lead` and `partner` Entities are provisioned by Lead and cannot be created, so a `POST` with either type returns `422 parameters_invalid`.


        Each entry in `identification_documents` and `additional_documents` takes a `file_id` from `POST /v2/files` or a declared `type`, not both.'
      parameters:
      - name: Idempotency-Key
        in: header
        description: A unique key for this request, up to 255 characters. Retrying with the same key and body returns the original response without creating a second entity. See [Idempotency](https://docs.lead.bank/api-reference/using-the-api/idempotency-v2).
        required: true
        schema:
          type: string
          maxLength: 255
        example: 3f1c9a52-7d4e-4b8a-9c21-6e0f5d2a8b14
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnEntityRequestBodyV2'
      responses:
        '200':
          description: Entity object created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnEntitySuccessResponseV2'
        '400':
          description: The request could not be parsed (`request_malformed`), or the `Idempotency-Key` header is missing (`idempotency_key_missing`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: idempotency_key_missing
                message: This endpoint requires an Idempotency-Key header. Add one and resend the request.
        '403':
          description: '`code` is one of:

            `authentication_missing` (the request has no credentials),

            `token_invalid` (the bearer token is missing, expired, or invalid, or does not grant `entity/read_write`),

            `source_ip_not_allowed` (the request came from an IP address that is not on your program''s allowlist).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: token_invalid
                message: The bearer token is missing, expired, malformed, or invalid.
        '409':
          description: A concurrent request with the same `Idempotency-Key` is still in flight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: idempotency_key_in_use
                message: A concurrent request using this Idempotency-Key is still in flight.
        '422':
          description: 'The request was parsed but cannot be processed. `code` is one of:

            `parameters_invalid` (a field is missing or invalid, including a malformed value (`value_malformed`) or one outside its allowed list, like a country, NAICS or currency code (`value_not_permitted`); `type` is `lead` or `partner` (`schema_violation`); a field that another field requires is missing, like `state` and `postal_code` on a US address, or a physical address on a business (`dependent_parameter_required`), or two fields don''t fit together, like an `ein` tax ID on an individual (`dependent_parameter_invalid`); `tax_identification` has a `type` without a `value`, or a `value` without a `type` (`parameter_group_incomplete`); a document entry has neither `file_id` nor `type`, or a `credit_details` entry has neither a score nor a non-score value (`parameter_group_empty`), or either has both (`parameters_mutually_exclusive`); the beneficial owners'' `ownership_percentage` values add up to more than 100 (`parameter_bound_exceeded`); a `file_id` appears more than once on the entity, or `intended_eligibility` lists a relationship type twice (`parameter_duplicated`); a screening or credit timestamp, or the date of birth, is in the future (`future_date_not_permitted`); an identification document has already expired (`past_date_not_permitted`); or the entity fails a check for a relationship type listed in `intended_eligibility`, where each failed check is an `errors[]` entry whose `code` is the check name. All failures are returned at once),

            `related_object_invalid` (a linked beneficial owner, control person, or sole proprietor, or a `file_id`, does not exist or belongs to another program; `errors[].code` is `reference_not_found`),

            `related_object_conflict` (a linked beneficial owner, control person, or sole proprietor is not an individual entity, or a file''s type is not allowed on that document entry; `errors[].code` is `reference_type_mismatched`),

            `lead_control_restricted` (your program is not enabled for Entity v2, or only allows individual entities and the request creates a `business` or `sole_prop`; `errors[].code` is `feature_not_enabled`),

            `idempotency_request_inconsistent` (this `Idempotency-Key` was used with a different request body).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: parameters_invalid
                message: One or more parameters are invalid.
                errors:
                - code: check_kyc_status
                  message: entity_xyz123 is not eligible for account_holder. KYC must be passed. Set kyc_details.result and kyc_details.screened_at.
                  parameters:
                  - intended_eligibility
                - code: check_physical_address
                  message: entity_xyz123 is not eligible for account_holder. A physical address is required. Set individual_details.address_details.physical_address.
                  parameters:
                  - intended_eligibility
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: rate_limit_exceeded
                message: You have exceeded the rate limit for this endpoint. Retry with backoff.
        '500':
          description: Internal server error. Retry with the same `Idempotency-Key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: internal_server_error
                message: Something went wrong on our end. Contact Lead with the Request-Id if this persists.
        '503':
          description: The service or endpoint is temporarily unavailable. Retry after a delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: service_unavailable
                message: The service is temporarily unavailable. Retry after the indicated delay.
        '504':
          description: An upstream system did not respond in time. Retry with backoff, and with the same `Idempotency-Key` on a `POST` or `PATCH`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: gateway_timeout
                message: An upstream system timed out. Retry with backoff.
    get:
      tags:
      - Entity
      operationId: list-entities-v2
      summary: List entities
      description: List Entities, filtered by `client_customer_id`. The filter is required. Each object in `objects` has the same shape as `GET /v2/entities/{id}` returns. If no Entity has that `client_customer_id`, `objects` is empty.
      parameters:
      - name: client_customer_id
        in: query
        required: true
        description: Return only entities with this `client_customer_id`.
        schema:
          type: string
        example: CUST-2024-001
      responses:
        '200':
          description: A list of entities. `objects` is empty if no entity matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEntitiesSuccessResponseV2'
        '400':
          description: The request could not be parsed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: request_malformed
                message: The request is invalid and cannot be parsed by the server.
                errors:
                - code: url_malformed
                  message: The request URL could not be parsed.
        '403':
          description: '`code` is one of:

            `authentication_missing` (the request has no credentials),

            `token_invalid` (the bearer token is missing, expired, or invalid, or does not grant `entity/read` or `entity/read_write`),

            `source_ip_not_allowed` (the request came from an IP address that is not on your program''s allowlist).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: token_invalid
                message: The bearer token is missing, expired, malformed, or invalid.
        '422':
          description: '`code` is one of:

            `parameters_invalid` (`client_customer_id` is missing; `errors[].code` is `schema_violation`),

            `lead_control_restricted` (your program is not enabled for Entity v2; `errors[].code` is `feature_not_enabled`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: parameters_invalid
                message: One or more parameters are invalid.
                errors:
                - code: schema_violation
                  message: client_customer_id is required.
                  parameters:
                  - client_customer_id
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: rate_limit_exceeded
                message: You have exceeded the rate limit for this endpoint. Retry with backoff.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: internal_server_error
                message: Something went wrong on our end. Contact Lead with the Request-Id if this persists.
        '503':
          description: The service or endpoint is temporarily unavailable. Retry after a delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: service_unavailable
                message: The service is temporarily unavailable. Retry after the indicated delay.
        '504':
          description: An upstream system did not respond in time. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: gateway_timeout
                message: An upstream system timed out. Retry with backoff.
  /v2/entities/{id}:
    patch:
      tags:
      - Entity
      operationId: update-an-entity-v2
      summary: Update an entity
      description: Update an `individual`, `business`, or `sole_prop` Entity. Some changes need a fresh KYC attestation. See Create and update for which changes need one and how `PATCH` handles each field.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EntityID'
      - name: Idempotency-Key
        in: header
        description: A unique key for this request, up to 255 characters. Retrying with the same key and body returns the original response without applying the update twice. See [Idempotency](https://docs.lead.bank/api-reference/using-the-api/idempotency-v2).
        required: true
        schema:
          type: string
          maxLength: 255
        example: 3f1c9a52-7d4e-4b8a-9c21-6e0f5d2a8b14
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnEntityRequestBodyV2'
      responses:
        '200':
          description: Entity object updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAnEntitySuccessResponseV2'
        '400':
          description: The request could not be parsed (`request_malformed`), or the `Idempotency-Key` header is missing (`idempotency_key_missing`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: request_malformed
                message: The request is invalid and cannot be parsed by the server.
                errors:
                - code: body_malformed
                  message: The request body is missing or isn't JSON.
        '403':
          description: '`code` is one of:

            `authentication_missing` (the request has no credentials),

            `token_invalid` (the bearer token is missing, expired, or invalid, or does not grant `entity/read_write`),

            `source_ip_not_allowed` (the request came from an IP address that is not on your program''s allowlist).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: token_invalid
                message: The bearer token is missing, expired, malformed, or invalid.
        '404':
          description: No entity exists with this ID, or it is not visible to your program.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: object_not_found
                message: No object exists at the requested ID, or it is not visible to this caller.
        '409':
          description: '`code` is one of:

            `idempotency_key_in_use` (a concurrent request with the same `Idempotency-Key` is still in flight),

            `object_modified_concurrently` (another request changed the entity while this one was processing; fetch it and retry).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: idempotency_key_in_use
                message: A concurrent request using this Idempotency-Key is still in flight.
        '422':
          description: 'The request was parsed but cannot be processed. `code` is one of:

            `parameters_invalid` (a field is missing or invalid, including a malformed value (`value_malformed`) or one outside its allowed list, like a country, NAICS or currency code (`value_not_permitted`); `type` does not match the entity, or a business switches between `us_entity` and `non_us_entity` (`parameter_immutable`); a field that another field requires is missing, like `state` and `postal_code` on a US address, or a later `kyc_details.screened_at` when a name, date of birth, tax ID, or business name or type changes (`dependent_parameter_required`), or two fields don''t fit together, like an `ein` tax ID on an individual (`dependent_parameter_invalid`); `tax_identification` has a `type` without a `value`, or a `value` without a `type` (`parameter_group_incomplete`); a document entry has neither `file_id` nor `type`, or a `credit_details` entry has neither a score nor a non-score value (`parameter_group_empty`), or either has both (`parameters_mutually_exclusive`); the beneficial owners'' `ownership_percentage` values add up to more than 100 (`parameter_bound_exceeded`); a `file_id` appears more than once on the entity, or `intended_eligibility` lists a relationship type twice (`parameter_duplicated`); a screening or credit timestamp, or the date of birth, is in the future (`future_date_not_permitted`); `kyc_details.screened_at` is not later than the stored one (`parameter_sequence_invalid`); the request clears a stored KYC or OFAC `result` or `screened_at` (`parameter_not_removable`); or the updated entity fails a check for a relationship type listed in `intended_eligibility`, where each failed check is an `errors[]` entry whose `code` is the check name. All failures are returned at once),

            `related_object_invalid` (a linked beneficial owner, control person, or sole proprietor, or a `file_id`, does not exist or belongs to another program; `errors[].code` is `reference_not_found`),

            `related_object_conflict` (a linked beneficial owner, control person, or sole proprietor is not an individual entity, or a file''s type is not allowed on that document entry; `errors[].code` is `reference_type_mismatched`),

            `lead_control_restricted` (your program is not enabled for Entity v2; `errors[].code` is `feature_not_enabled`),

            `operation_invalid` (the entity is a `lead` or `partner` entity, which cannot be updated; `errors[].code` is `object_lead_managed`; a body whose `type` is `lead` or `partner` returns `parameters_invalid` (`schema_violation`) instead, because the body is validated first),

            `idempotency_request_inconsistent` (this `Idempotency-Key` was used with a different request body).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: parameters_invalid
                message: One or more parameters are invalid.
                errors:
                - code: check_date_of_birth
                  message: entity_xyz123 is not eligible for account_holder. The entity must be 18 or older.
                  parameters:
                  - intended_eligibility
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: rate_limit_exceeded
                message: You have exceeded the rate limit for this endpoint. Retry with backoff.
        '500':
          description: Internal server error. Retry with the same `Idempotency-Key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: internal_server_error
                message: Something went wrong on our end. Contact Lead with the Request-Id if this persists.
        '503':
          description: The service or endpoint is temporarily unavailable. Retry after a delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: service_unavailable
                message: The service is temporarily unavailable. Retry after the indicated delay.
        '504':
          description: An upstream system did not respond in time. Retry with backoff, and with the same `Idempotency-Key` on a `POST` or `PATCH`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: gateway_timeout
                message: An upstream system timed out. Retry with backoff.
    get:
      tags:
      - Entity
      operationId: retrieve-an-entity-by-entity-id-v2
      summary: Retrieve an entity
      description: Retrieve an Entity by its ID. Entities created on v0 are returned in this shape. `eligibility` is computed from the Entity's current data on every read. This also returns your program's `lead` and `partner` Entities, which Lead provisions and which have a reduced, read-only shape. Documents sent through v0 are returned read-only in `legacy_identification_documents` and `legacy_additional_documents`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EntityID'
      responses:
        '200':
          description: An entity object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveAnEntitySuccessResponseV2'
        '400':
          description: The request could not be parsed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: request_malformed
                message: The request is invalid and cannot be parsed by the server.
                errors:
                - code: url_malformed
                  message: The request URL could not be parsed.
        '403':
          description: '`code` is one of:

            `authentication_missing` (the request has no credentials),

            `token_invalid` (the bearer token is missing, expired, or invalid, or does not grant `entity/read` or `entity/read_write`),

            `source_ip_not_allowed` (the request came from an IP address that is not on your program''s allowlist).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: token_invalid
                message: The bearer token is missing, expired, malformed, or invalid.
        '404':
          description: No entity exists with this ID, or it is not visible to your program.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: object_not_found
                message: No object exists at the requested ID, or it is not visible to this caller.
        '422':
          description: Your program is not enabled for Entity v2 (`lead_control_restricted`; `errors[].code` is `feature_not_enabled`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: lead_control_restricted
                message: A Lead-configured control blocks this request. Contact Lead with the Lead-Request-ID.
                errors:
                - code: feature_not_enabled
                  message: Entity v2 isn't enabled for your program. Contact Lead to enable it.
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: rate_limit_exceeded
                message: You have exceeded the rate limit for this endpoint. Retry with backoff.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: internal_server_error
                message: Something went wrong on our end. Contact Lead with the Request-Id if this persists.
        '503':
          description: The service or endpoint is temporarily unavailable. Retry after a delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: service_unavailable
                message: The service is temporarily unavailable. Retry after the indicated delay.
        '504':
          description: An upstream system did not respond in time. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: gateway_timeout
                message: An upstream system timed out. Retry with backoff.
components:
  schemas:
    RfiDetailsResultEnum:
      type: string
      enum:
      - requested
      - completed
      example: completed
      description: Result of request for information with the end customer. Leave blank if RFI has not been sent to the customer.
    EntityTypePartner:
      type: string
      pattern: ^partner$
      default: partner
      description: Type of entity = partner. Lead provisions it; you cannot create or update it.
    ContactMethodTypeEmail:
      type: string
      pattern: ^email$
      default: email
      description: ContactMethodType = email.
    UpdateAddressDetails:
      type: object
      properties:
        physical_address:
          $ref: '#/components/schemas/UpdateAddress'
          description: Physical address for the entity. Physical addresses must not be P.O. boxes, registered agent addresses or in prohibited countries.
        mailing_address:
          $ref: '#/components/schemas/UpdateAddress'
          description: Mailing address for the entity.
        other_addresses:
          type: array
          description: Other addresses for the entity.
          items:
            $ref: '#/components/schemas/Address'
    BusinessDetailsV2:
      type: object
      required:
      - name
      - identification_details
      - address_details
      properties:
        type:
          $ref: '#/components/schemas/BusinessTypeEnum'
        name:
          type: string
          description: Legal name of the business. Must be at least 2 characters.
        gross_annual_revenue:
          type: string
          description: Business gross revenue for prior fiscal year.
        currency_code:
          type: string
          description: A three-letter currency code as defined in ISO 4217.
        industry:
          type: array
          items:
            type: string
          description: NAICS code(s) for the applicable industries. 2-6 digits of NAICS code(s) are accepted and valid NAICS codes can be found on naics.com/search. Please refer to 2022 NAICS Reference Files.
        doing_business_as:
          type: string
          description: Business name if the business operates under a different name.
        website:
          type: string
          description: The website of the business. Must start with http:// or https://.
        contact_methods:
          type: array
          items:
            $ref: '#/components/schemas/ContactMethod'
        address_details:
          $ref: '#/components/schemas/AddressDetails'
        identification_details:
          $ref: '#/components/schemas/IdentificationDetailsBusinessV2'
        additional_documents:
          $ref: '#/components/schemas/AdditionalDocumentsV2'
      description: Details for the business entity.
    CreditDetails:
      type: object
      required:
      - credit_report_source
      - credit_pulled_at
      properties:
        credit_score:
          type: string
          description: Credit score given by the credit bureau. Cannot be above 850. Mutually exclusive with `credit_report_non_score_value`.
        credit_report_non_score_value:
          $ref: '#/components/schemas/CreditReportNonScoreValueEnum'
        credit_report_source:
          $ref: '#/components/schemas/CreditReportSourceEnum'
        credit_pulled_at:
          type: string
          format: date-time
          description: Date time credit is pulled at.
      description: Details on credit data from credit bureaus on the entity. Exactly one of `credit_score` or `credit_report_non_score_value` must be provided.
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: A human-readable description of the error family. Identical for every occurrence of a given `code`; carries no request-specific detail.
          example: One or more parameters are invalid.
        errors:
          type: array
          description: Zero or more specific errors within this family. Always present for validation errors, one entry per failing field.
          items:
            $ref: '#/components/schemas/ErrorItem'
    CreateAnIndividualEntityRequestBody:
      title: Individual
      type: object
      required:
      - type
      - individual_details
      properties:
        client_customer_id:
          type: string
          maxLength: 64
          description: Client customer ID for the entity object. Limit of 64 characters.
        type:
          $ref: '#/components/schemas/EntityTypeIndividual'
        intended_roles:
          type: array
          items:
            $ref: '#/components/schemas/IntendedRolesEnum'
          description: The entity's intended role(s). In the event more than 1 role is passed in and at least 1 role doesn’t pass validation, the request will not succeed; it is an all or nothing behavior. For type `business` or `sole_prop`, only `account_holder` should be provided.
