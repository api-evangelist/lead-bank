          type: string
          description: 'Address line 2 is optional and should be used only for secondary or sub-premise information, such as:

            - apartment

            - unit

            - suite

            - floor

            - building

            - care-of / attention


            If there is no secondary or sub-premise information, address line 2 should be blank.


            Do not use address line 2 for any part of the primary street address.'
