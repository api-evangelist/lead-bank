openapi: 3.2.0
info:
  title: Lead Bank User Account API
  description: Lead Bank's APIs
  version: v1.0
servers:
- url: https://api.sandbox.lead.bank
- url: https://api.lead.bank
security:
- bearerAuth: []
tags:
- name: User Account
paths:
  /v2/user_accounts:
    post:
      tags:
      - User Account
      operationId: create-a-user-account-v2
      summary: Create a user account
      description: Create a User Account.
      parameters:
      - name: Idempotency-Key
        in: header
        description: A unique key for this request, up to 255 characters. Retrying with the same key and body returns the original response without creating a second user account. See [Idempotency](https://docs.lead.bank/api-reference/using-the-api/idempotency-v2).
        required: true
        schema:
          type: string
          maxLength: 255
        example: 3f1c9a52-7d4e-4b8a-9c21-6e0f5d2a8b14
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserAccountRequestV2'
            examples:
              consumer_deposit:
                summary: Consumer deposit user account
                value:
                  requested_features:
                  - deposit
                  product_config_id: product_config_xyz123
                  entities:
                    account_holders:
                    - entity_consumer_123
                  product_name: Everyday Checking
                  metadata: {}
                  documents: []
              commercial_credit:
                summary: Commercial credit user account
                value:
                  application_id: application_xyz123
                  requested_features:
                  - credit_with_underwriting
                  product_config_id: product_config_xyz123
                  balance_sheet_model: held_for_investment
                  entities:
                    account_holders:
                    - entity_biz_456
                    authorized_signers:
                    - entity_signer_789
                  product_name: Business Credit Line
                  details:
                    underwriting:
                      is_secured: false
                      is_mla: false
                      underwriting_grade: A
                      currency_code: USD
                      available_credit: 5000000
                      limit: 5000000
                      max_limit: 10000000
                  metadata:
                    external_id: BIZ-2024-001
                  documents:
                  - file_id: file_7RwQ2mK9pL4xT1vN8jS5
                    timestamp: '2025-11-15T09:00:00Z'
      responses:
        '200':
          description: User account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountV2'
        '400':
          description: The request could not be parsed (`request_malformed`), or the `Idempotency-Key` header is missing (`idempotency_key_missing`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: idempotency_key_missing
                message: This endpoint requires an Idempotency-Key header. Add one and resend the request.
        '403':
          description: '`code` is one of:

            `authentication_missing` (the request has no credentials),

            `token_invalid` (the bearer token is missing, expired, or invalid, or does not grant `user_account/read_write`),

            `source_ip_not_allowed` (the request came from an IP address that is not on your program''s allowlist).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: token_invalid
                message: The bearer token is missing, expired, malformed, or invalid.
        '409':
          description: A concurrent request with the same `Idempotency-Key` is still in flight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: idempotency_key_in_use
                message: A concurrent request using this Idempotency-Key is still in flight.
        '413':
          description: The request body is over this endpoint's size limit, for example because `metadata` is too large (`content_too_large`; `errors[].code` is `body_too_large`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: content_too_large
                message: The request is over a size limit for this endpoint. Make it smaller and resend it.
                errors:
                - code: body_too_large
                  message: metadata is over this endpoint's size limit.
                  parameters:
                  - metadata
        '422':
          description: 'The request was parsed but cannot be processed. `code` is one of:

            `parameters_invalid` (a field is missing or invalid; a feature-dependent field is missing, like `balance_sheet_model` when `requested_features` includes a credit feature, or `application_id` and `details.underwriting` for `credit_with_underwriting` (`dependent_parameter_required`); `limit` exceeds `max_limit` (`parameter_bound_exceeded`); a `documents[].file_id` appears twice, or an entity appears twice in one relationship type (`parameter_duplicated`); or a `documents[].timestamp` is more than five minutes in the future (`future_date_not_permitted`). All failures are returned at once),

            `related_object_invalid` (an entity, the `application_id`, the `product_config_id` or a `documents[].file_id` does not exist or belongs to another program; `errors[].code` is `reference_not_found`, with the path in `parameters`),

            `related_object_not_ready` (an entity is not eligible for its relationship type (`entity_role_missing`), with the entity''s path in `parameters`; update the entity, then retry the request unchanged),

            `related_object_conflict` (the account holders mix consumer and commercial entities (`account_holder_types_mismatched`), or an account holder is a lead or partner entity, or a `documents[].file_id` references a file whose type is not a compliance document type (`reference_type_mismatched`)),

            `lead_control_restricted` (your program is not enabled for User Accounts v2; `errors[].code` is `feature_not_enabled`),

            `idempotency_request_inconsistent` (this `Idempotency-Key` was used with a different request body).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: parameters_invalid
                message: One or more parameters are invalid.
                errors:
                - code: dependent_parameter_required
                  message: balance_sheet_model is required when requested_features includes a credit feature.
                  parameters:
                  - balance_sheet_model
                - code: parameter_bound_exceeded
                  message: details.underwriting.limit (10000000) cannot exceed details.underwriting.max_limit (5000000).
                  parameters:
                  - details.underwriting.limit
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: rate_limit_exceeded
                message: You have exceeded the rate limit for this endpoint. Retry with backoff.
        '500':
          description: Internal server error. Retry with the same `Idempotency-Key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: internal_server_error
                message: Something went wrong on our end. Contact Lead with the Request-Id if this persists.
        '503':
          description: The service or endpoint is temporarily unavailable. Retry after a delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: service_unavailable
                message: The service is temporarily unavailable. Retry after the indicated delay.
        '504':
          description: An upstream system did not respond in time. Retry with backoff, and with the same `Idempotency-Key` on a `POST` or `PATCH`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: gateway_timeout
                message: An upstream system timed out. Retry with backoff.
    get:
      tags:
      - User Account
      operationId: list-user-accounts-v2
      summary: List user accounts
      description: List User Accounts, filtered by the `client_account_id` you assigned in an Account file. Use it to find the `id` of User Accounts you created through Account files. The filter is required, and `objects` has at most one User Account.
      parameters:
      - name: client_account_id
        in: query
        required: true
        description: Return only user accounts with this `client_account_id`.
        schema:
          type: string
        example: BIZ-2024-001
      responses:
        '200':
          description: A list of User Account objects.
          content:
            application/json:
              schema:
                type: object
                required:
                - objects
                - has_more
                properties:
                  objects:
                    type: array
                    description: At most one user account.
                    items:
                      $ref: '#/components/schemas/UserAccountV2'
                  has_more:
                    type: boolean
                    description: Always `false`. At most one user account matches a `client_account_id`.
        '400':
          description: The request could not be parsed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: request_malformed
                message: The request is invalid and cannot be parsed by the server.
                errors:
                - code: url_malformed
                  message: The request URL could not be parsed.
        '403':
          description: '`code` is one of:

            `authentication_missing` (the request has no credentials),

            `token_invalid` (the bearer token is missing, expired, or invalid, or does not grant `user_account/read` or `user_account/read_write`),

            `source_ip_not_allowed` (the request came from an IP address that is not on your program''s allowlist).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: token_invalid
                message: The bearer token is missing, expired, malformed, or invalid.
        '422':
          description: '`code` is one of:

            `parameters_invalid` (`client_account_id` is missing; `errors[].code` is `schema_violation`),

            `lead_control_restricted` (your program is not enabled for User Accounts v2; `errors[].code` is `feature_not_enabled`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: parameters_invalid
                message: One or more parameters are invalid.
                errors:
                - code: schema_violation
                  message: client_account_id is required.
                  parameters:
                  - client_account_id
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: rate_limit_exceeded
                message: You have exceeded the rate limit for this endpoint. Retry with backoff.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: internal_server_error
                message: Something went wrong on our end. Contact Lead with the Request-Id if this persists.
        '503':
          description: The service or endpoint is temporarily unavailable. Retry after a delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: service_unavailable
                message: The service is temporarily unavailable. Retry after the indicated delay.
        '504':
          description: An upstream system did not respond in time. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: gateway_timeout
                message: An upstream system timed out. Retry with backoff.
  /v2/user_accounts/{user_account_id}:
    get:
      tags:
      - User Account
      operationId: retrieve-a-user-account-v2
      summary: Retrieve a user account
      description: Retrieve a User Account by its ID.
      parameters:
      - name: user_account_id
        in: path
        required: true
        description: User Account ID
        schema:
          $ref: '#/components/schemas/UserAccountID'
        example: user_account_2N5Hk8xYmQpL9rBvC3jD
      responses:
        '200':
          description: User account object retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountV2'
        '400':
          description: The request could not be parsed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: request_malformed
                message: The request is invalid and cannot be parsed by the server.
                errors:
                - code: url_malformed
                  message: The request URL could not be parsed.
        '403':
          description: '`code` is one of:

            `authentication_missing` (the request has no credentials),

            `token_invalid` (the bearer token is missing, expired, or invalid, or does not grant `user_account/read` or `user_account/read_write`),

            `source_ip_not_allowed` (the request came from an IP address that is not on your program''s allowlist).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: token_invalid
                message: The bearer token is missing, expired, malformed, or invalid.
        '404':
          description: No user account exists with this ID, or it is not visible to your program.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: object_not_found
                message: No object exists at the requested ID, or it is not visible to this caller.
        '422':
          description: Your program is not enabled for User Accounts v2 (`lead_control_restricted`; `errors[].code` is `feature_not_enabled`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: lead_control_restricted
                message: A Lead-configured control blocks this request. Contact Lead with the Lead-Request-ID.
                errors:
                - code: feature_not_enabled
                  message: User Accounts v2 isn't enabled for your program. Contact Lead to enable it.
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: rate_limit_exceeded
                message: You have exceeded the rate limit for this endpoint. Retry with backoff.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: internal_server_error
                message: Something went wrong on our end. Contact Lead with the Request-Id if this persists.
        '503':
          description: The service or endpoint is temporarily unavailable. Retry after a delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: service_unavailable
                message: The service is temporarily unavailable. Retry after the indicated delay.
        '504':
          description: An upstream system did not respond in time. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: gateway_timeout
                message: An upstream system timed out. Retry with backoff.
    patch:
      tags:
      - User Account
      operationId: update-a-user-account-v2
      summary: Update a user account
      description: Update a User Account. See User Account Object for the fields you can change.
      parameters:
      - name: user_account_id
        in: path
        required: true
        description: User Account ID
        schema:
          $ref: '#/components/schemas/UserAccountID'
      - name: Idempotency-Key
        in: header
        description: A unique key for this request, up to 255 characters. Retrying with the same key and body returns the original response without applying the update twice. See [Idempotency](https://docs.lead.bank/api-reference/using-the-api/idempotency-v2).
        required: true
        schema:
          type: string
          maxLength: 255
        example: 3f1c9a52-7d4e-4b8a-9c21-6e0f5d2a8b14
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserAccountRequestV2'
            examples:
              update_metadata:
                summary: Update metadata
                value:
                  metadata:
                    external_id: BIZ-2024-002
              update_underwriting:
                summary: Update underwriting details
                value:
                  details:
                    underwriting:
                      available_credit: 3000000
                      limit: 3000000
      responses:
        '200':
          description: User account updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountV2'
        '400':
          description: The request could not be parsed (`request_malformed`), or the `Idempotency-Key` header is missing (`idempotency_key_missing`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: request_malformed
                message: The request is invalid and cannot be parsed by the server.
                errors:
                - code: body_malformed
                  message: The request body is missing or isn't a JSON object.
        '403':
          description: '`code` is one of:

            `authentication_missing` (the request has no credentials),

            `token_invalid` (the bearer token is missing, expired, or invalid, or does not grant `user_account/read_write`),

            `source_ip_not_allowed` (the request came from an IP address that is not on your program''s allowlist).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: token_invalid
                message: The bearer token is missing, expired, malformed, or invalid.
        '404':
          description: No user account exists with this ID, or it is not visible to your program.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: object_not_found
                message: No object exists at the requested ID, or it is not visible to this caller.
        '409':
          description: '`code` is one of:

            `idempotency_key_in_use` (a concurrent request with the same `Idempotency-Key` is still in flight),

            `object_modified_concurrently` (another request changed the user account while this one was processing; fetch it and retry).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: idempotency_key_in_use
                message: A concurrent request using this Idempotency-Key is still in flight.
        '413':
          description: The request body is over this endpoint's size limit, for example because `metadata` is too large (`content_too_large`; `errors[].code` is `body_too_large`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: content_too_large
                message: The request is over a size limit for this endpoint. Make it smaller and resend it.
                errors:
                - code: body_too_large
                  message: metadata is over this endpoint's size limit.
                  parameters:
                  - metadata
        '422':
          description: 'The request was parsed but cannot be processed. `code` is one of:

            `parameters_invalid` (a field is invalid; an immutable field such as `entities` or `product_config_id` is sent; `balance_sheet_model` is sent without adding a credit feature, or is already set; the updated `limit` exceeds `max_limit` (`parameter_bound_exceeded`); a `documents[].file_id` appears twice (`parameter_duplicated`); or a `documents[].timestamp` is more than five minutes in the future (`future_date_not_permitted`). All failures are returned at once),

            `related_object_invalid` (the `application_id` or a `documents[].file_id` does not exist or belongs to another program; `errors[].code` is `reference_not_found`, with the path in `parameters`),

            `related_object_conflict` (a `documents[].file_id` references a file whose type is not a compliance document type; `errors[].code` is `reference_type_mismatched`),

            `object_state_conflict` (the user account is closed and cannot be modified),

            `lead_control_restricted` (your program is not enabled for User Accounts v2; `errors[].code` is `feature_not_enabled`),

            `idempotency_request_inconsistent` (this `Idempotency-Key` was used with a different request body).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: parameters_invalid
                message: One or more parameters are invalid.
                errors:
                - code: parameter_bound_exceeded
                  message: details.underwriting.limit (12000000) cannot exceed details.underwriting.max_limit (10000000).
                  parameters:
                  - details.underwriting.limit
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: rate_limit_exceeded
                message: You have exceeded the rate limit for this endpoint. Retry with backoff.
        '500':
          description: Internal server error. Retry with the same `Idempotency-Key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: internal_server_error
                message: Something went wrong on our end. Contact Lead with the Request-Id if this persists.
        '503':
          description: The service or endpoint is temporarily unavailable. Retry after a delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: service_unavailable
                message: The service is temporarily unavailable. Retry after the indicated delay.
        '504':
          description: An upstream system did not respond in time. Retry with backoff, and with the same `Idempotency-Key` on a `POST` or `PATCH`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: gateway_timeout
                message: An upstream system timed out. Retry with backoff.
  /v2/user_accounts/{user_account_id}/activate:
    post:
      tags:
      - User Account
      operationId: activate-a-user-account-v2
      summary: Activate a user account
      description: Activate an `inactive` User Account. You can also activate a `closed` User Account to correct a mistaken closure. See Correcting a mistaken closure.
      parameters:
      - name: user_account_id
        in: path
        required: true
        description: User Account ID
        schema:
          $ref: '#/components/schemas/UserAccountID'
      - name: Idempotency-Key
        in: header
        description: A unique key for this request, up to 255 characters. Retrying with the same key and body returns the original response without applying the update twice. See [Idempotency](https://docs.lead.bank/api-reference/using-the-api/idempotency-v2).
        required: true
        schema:
          type: string
          maxLength: 255
        example: 3f1c9a52-7d4e-4b8a-9c21-6e0f5d2a8b14
      responses:
        '200':
          description: User account activated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountV2'
        '400':
          description: The request could not be parsed (`request_malformed`), or the `Idempotency-Key` header is missing (`idempotency_key_missing`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: idempotency_key_missing
                message: This endpoint requires an Idempotency-Key header. Add one and resend the request.
        '403':
          description: '`code` is one of:

            `authentication_missing` (the request has no credentials),

            `token_invalid` (the bearer token is missing, expired, or invalid, or does not grant `user_account/read_write`),

            `source_ip_not_allowed` (the request came from an IP address that is not on your program''s allowlist).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: token_invalid
                message: The bearer token is missing, expired, malformed, or invalid.
        '404':
          description: No user account exists with this ID, or it is not visible to your program.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: object_not_found
                message: No object exists at the requested ID, or it is not visible to this caller.
        '409':
          description: '`code` is one of:

            `idempotency_key_in_use` (a concurrent request with the same `Idempotency-Key` is still in flight),

            `object_modified_concurrently` (another request changed the user account while this one was processing; fetch it and retry).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: idempotency_key_in_use
                message: A concurrent request using this Idempotency-Key is still in flight.
        '422':
          description: 'The request was parsed but cannot be processed. `code` is one of:

            `object_state_conflict` (the user account cannot be activated from its current status, for example because it is already `active`),

            `lead_control_restricted` (your program is not enabled for User Accounts v2; `errors[].code` is `feature_not_enabled`),

            `idempotency_request_inconsistent` (this `Idempotency-Key` was used with a different request body).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: object_state_conflict
                message: The object is not in the state this request assumed. Fetch its current state before retrying.
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: rate_limit_exceeded
                message: You have exceeded the rate limit for this endpoint. Retry with backoff.
        '500':
          description: Internal server error. Retry with the same `Idempotency-Key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: internal_server_error
                message: Something went wrong on our end. Contact Lead with the Request-Id if this persists.
        '503':
          description: The service or endpoint is temporarily unavailable. Retry after a delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: service_unavailable
                message: The service is temporarily unavailable. Retry after the indicated delay.
        '504':
          description: An upstream system did not respond in time. Retry with backoff, and with the same `Idempotency-Key` on a `POST` or `PATCH`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: gateway_timeout
                message: An upstream system timed out. Retry with backoff.
  /v2/user_accounts/{user_account_id}/deactivate:
    post:
      tags:
      - User Account
      operationId: deactivate-a-user-account-v2
      summary: Deactivate a user account
      description: Deactivate an `active` User Account.
      parameters:
      - name: user_account_id
        in: path
        required: true
        description: User Account ID
        schema:
