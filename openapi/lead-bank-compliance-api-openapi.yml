    AccountDetails:
      type: object
      description: Core details of the account
      readOnly: true
      properties:
        product_name:
          type: string
          description: Partner's name for their product
        closed_at:
          type: string
          format: date-time
          description: Timestamp when the account was closed. Updated by /close endpoint.
          readOnly: true
        credit:
          $ref: '#/components/schemas/AccountCredit'
        adverse_action_notice:
          $ref: '#/components/schemas/AdverseActionNotice'
    EntityID:
      type: string
      description: The ID of your entity.
      example: entity_xyz123
      pattern: ^entity_[^\s]{1,33}$
    AccountCredit:
      type: object
      description: Details specific to credit-based accounts
      additionalProperties: false
      properties:
        is_secured:
          type: boolean
          description: Indicates if this is a secured credit/deposit product
        is_mla:
          type: boolean
          description: Indicates if this account is considered a Military Lending Act account
        underwriting_grade:
          type: string
          description: Grade given to the customer based on underwriting
        currency:
          type: string
          description: The currency for the account (3-letter ISO code)
          example: USD
        available_credit:
          type: integer
          description: Available credit for the customer to draw (in minor units)
        limit:
          type: integer
          description: Current credit limit (in minor units)
        max_limit:
          type: integer
          description: Maximum credit limit approved in underwriting (in minor units)
        scra:
          $ref: '#/components/schemas/Scra'
        report:
          $ref: '#/components/schemas/CreditReport'
    AccountCloseRequest:
      type: object
      description: Request body for closing an account
      properties:
        status_reason:
          $ref: '#/components/schemas/AccountCloseStatusReason'
      required:
      - status_reason
    Decision:
      type: object
      description: Decision-related information for the application
      properties:
        decided_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the underwriting decision was made.
        reason:
          type: string
          description: The reason for the decision.
        exception_approval_reason:
          type: string
          description: This should only be provided if the decision was made as an exception to underwriting criteria. Reason for exception approval, if this decision was made as an exception to the traditional underwriting process.
      required:
      - decided_at
      - reason
    Metadata:
      type: object
      additionalProperties:
        type: string
      description: A set of key-value pairs that can be used to store additional information related to this object.
    CreateComplianceDocument:
      type: object
      description: "Document reference for creating applications and accounts.\n\nOne of `displayed_at` or `consented_at` is required depending on document type:\n- `displayed_at`: Required for aan, loan_agreement, loc_agreement, truth_in_lending_document,\n  ach_authorization, notice_of_incompleteness, credit_score_notice, offer_summary, personal_guarantee,\n  consumer_credit_auth, partner_privacy_policy, lead_privacy_policy, terms_of_use, fcra_notice,\n  tcpa_consent, patriot_act_notice, mla_notice, pre_approval_terms, eft_authorization,\n  prohibited_industry_certification, decision_maker_document, bo_certification, missed_payments_policy,\n  lead_funds_transfer_agreement\n- `consented_at`: Required for esign_agreement, credit_pull_consent, consent_to_link_account,\n  consent_to_link_hsa, negative_option_consent\n"
      properties:
        document_id:
          type: string
          description: Unique identifier for the document being referenced. Please use the file name of the file delivered to Lead's `/documents` SFTP directory.
          example: document_2N5Hk8xYmQpL9rBvC3jD
        type:
          $ref: '#/components/schemas/ComplianceDocumentType'
        displayed_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the document was displayed to the applicant. Present on disclosure documents.
        consented_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the applicant consented to the document. Present on consent documents.
        version:
          type: string
          description: It is recommended to use this for static documents uploaded once and uploaded for many users. Uploads with a new version should have a different document_id as well.
          example: v1
      required:
      - document_id
      - type
      oneOf:
      - title: Disclosure
        description: Disclosure document — `displayed_at` is required.
        properties:
          type:
            type: string
            enum:
            - aan
            - loan_agreement
            - loc_agreement
            - truth_in_lending_document
            - ach_authorization
            - notice_of_incompleteness
            - credit_score_notice
            - offer_summary
            - personal_guarantee
            - consumer_credit_auth
            - partner_privacy_policy
            - lead_privacy_policy
            - terms_of_use
            - fcra_notice
            - tcpa_consent
            - patriot_act_notice
            - mla_notice
            - pre_approval_terms
            - eft_authorization
            - prohibited_industry_certification
            - decision_maker_document
            - bo_certification
            - missed_payments_policy
            - lead_funds_transfer_agreement
        required:
        - displayed_at
      - title: Consent
        description: Consent document — `consented_at` is required.
        properties:
          type:
            type: string
            enum:
            - esign_agreement
            - credit_pull_consent
            - consent_to_link_account
            - consent_to_link_hsa
            - negative_option_consent
        required:
        - consented_at
    CreateApplicationEntities:
      type: object
      description: 'Entity relationships for the application.

        Maximum 20 entities per relationship type.

        Authorized signers required for commercial account holders.

        '
      properties:
        account_holders:
          type: array
          description: List of entity IDs that are account holders
          items:
            $ref: '#/components/schemas/EntityID'
          minItems: 1
          maxItems: 20
        authorized_signers:
          type: array
          description: List of entity IDs that are authorized signers (required for commercial)
          items:
            $ref: '#/components/schemas/EntityID'
          maxItems: 20
        authorized_users:
          type: array
          description: List of entity IDs that are authorized users
          items:
            $ref: '#/components/schemas/EntityID'
          maxItems: 20
      required:
      - account_holders
    PatchAccountDetails:
      type: object
      description: Details for updating an account
      properties:
        product_name:
          type: string
          description: Partner's name for their product
        credit:
          $ref: '#/components/schemas/PatchAccountCredit'
        adverse_action_notice:
          $ref: '#/components/schemas/AdverseActionNotice'
    CreditReport:
      type: object
      description: Credit report information (Application only)
      required:
      - score
      - pulled_at
      - source
      properties:
        score:
          type: integer
          description: Credit score returned by the bureau. Supported range is 300-850.
          minimum: 300
          maximum: 850
        pulled_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the credit report was pulled.
        source:
          type: string
          description: 'Credit bureau that issued the report. Possible values: `equifax`, `experian`, `transunion`.'
          enum:
          - equifax
          - transunion
          - experian
    APIError:
      type: object
      properties:
        code:
          type: string
          description: The error code.
        title:
          type: string
          description: The error title.
        detail:
          type: string
          description: A detailed error description.
        status:
          type: string
          description: The HTTP status code.
        invalid_parameters:
          type: array
          description: Invalid request parameters with reasons, if applicable.
