  /v0/accounts/{id}/entity_relationships:
    get:
      tags:
      - Compliance
      operationId: list-account-entity-relationships
      summary: List account entity relationships
      description: Lists all entity relationships for a specific account.
      parameters:
      - name: id
        in: path
        required: true
        description: Account ID
        schema:
          $ref: '#/components/schemas/AccountID'
      - name: limit
        in: query
        required: false
        description: Maximum number of results to return. Defaults to 25, max 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: starting_after
        in: query
        required: false
        description: A cursor for pagination. Returns results starting after this cursor.
        schema:
          type: string
      responses:
        '200':
          description: List of entity relationships for the account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more:
                    type: boolean
                    description: Indicates whether more results are available beyond this page.
                  cursor:
                    type: string
                    description: Cursor to retrieve the next page of results. Only present when has_more is true.
                  objects:
                    type: array
                    items:
                      $ref: '#/components/schemas/EntityRelationship'
                required:
                - has_more
                - objects
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Valid access token was not used to call the API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Account ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Too many requests. Please slow down your request rate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Server error. Please try your request again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v0/accounts/{id}/entity_relationships/{entity_id}:
    delete:
      tags:
      - Compliance
      operationId: delete-account-entity-relationship
      summary: Delete account entity relationship
      description: 'Deletes a specific entity relationship from an account and returns the updated list of entity relationships.

        The relationship_type must be specified to identify which relationship to delete.

        '
      parameters:
      - name: id
        in: path
        required: true
        description: Account ID
        schema:
          $ref: '#/components/schemas/AccountID'
      - name: entity_id
        in: path
        required: true
        description: Entity ID to remove from the account relationships
        schema:
          $ref: '#/components/schemas/EntityID'
      - name: relationship_type
        in: query
        required: true
        description: The specific relationship type to delete for the entity.
        schema:
          $ref: '#/components/schemas/EntityRelationshipType'
      responses:
        '200':
          description: Entity relationship deleted successfully. Returns the updated list of entity relationships for the account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  objects:
                    type: array
                    items:
                      $ref: '#/components/schemas/EntityRelationship'
                required:
                - objects
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Valid access token was not used to call the API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Account ID or Entity ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              examples:
                account_not_found:
                  summary: Account not found
                  value:
                    code: parameters_invalid
                    title: Your request parameters did not validate.
                    detail: Account ID does not exist.
                    invalid_parameters:
                    - name: id
                      reason: not_found
                entity_relationship_not_found:
                  summary: Entity relationship not found
                  value:
                    code: parameters_invalid
                    title: Your request parameters did not validate.
                    detail: The specified relationship type for this entity does not exist on this account.
                    invalid_parameters:
                    - name: entity_id
                      reason: not_found
                    - name: relationship_type
                      reason: not_found
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Too many requests. Please slow down your request rate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Server error. Please try your request again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v0/accounts/{id}/entity_relationships/batch:
    post:
      tags:
      - Compliance
      operationId: batch-create-account-entity-relationships
      summary: Batch create account entity relationships
      description: 'Associates multiple entities with an account under a single relationship type.

        '
      parameters:
      - name: id
        in: path
        required: true
        description: Account ID
        schema:
          $ref: '#/components/schemas/AccountID'
      - name: Idempotency-Key
        in: header
        required: true
        description: Unique key to ensure idempotent requests
        schema:
          type: string
          maxLength: 255
        example: batch-entity-rel-12345-abc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateEntityRelationshipsRequest'
            examples:
              authorized_user:
                summary: Batch add authorized users
                value:
                  entity_ids:
                  - entity_8kL9jH7gF6dS5aQ4wE3rT2yU1iO
                  - entity_2mN3bV4cX5zL6kwdJ7hG8fD9sA0
                  - entity_1qW2eR3tY4uI5oP6aS7dF8gH9jK
                  - entity_9pLuO8iK7yJ6hT5gR4fE3dD2sS1
                  - entity_5zX4cV3bN2m1qW0eR9tY8uI7oP6
                  relationship_type: authorized_user
      responses:
        '200':
          description: Entity relationships created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id:
                    $ref: '#/components/schemas/AccountID'
                  relationship_type:
                    $ref: '#/components/schemas/EntityRelationshipType'
                  entity_ids:
                    type: array
                    description: List of entity IDs associated with the account under the specified relationship type.
                    items:
                      $ref: '#/components/schemas/EntityID'
                required:
                - account_id
                - relationship_type
                - entity_ids
              examples:
                authorized_user:
                  summary: Batch add authorized users
                  value:
                    account_id: account_9h8g7f6e5d4c3b2a1z0y9x8w7v6
                    relationship_type: authorized_user
                    entity_ids:
                    - entity_8kL9jH7gF6dS5aQ4wE3rT2yU1iO
                    - entity_2mN3bV4cX5zL6kwdJ7hG8fD9sA0
                    - entity_1qW2eR3tY4uI5oP6aS7dF8gH9jK
                    - entity_9pLuO8iK7yJ6hT5gR4fE3dD2sS1
                    - entity_5zX4cV3bN2m1qW0eR9tY8uI7oP6
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Valid access token was not used to call the API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Access denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Account ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '409':
          description: A request with this Idempotency-Key has already been processed with different parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Too many requests. Please slow down your request rate.
          content:
