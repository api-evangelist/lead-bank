                message: The object is not in the state this request assumed. Fetch its current state before retrying.
                errors:
                - code: object_balance_nonzero
                  message: User Credit Balance user_credit_balance_xyz123 has a balance of 1250.00. Bring it to zero before closing.
        '429':
          description: Rate limit exceeded.
