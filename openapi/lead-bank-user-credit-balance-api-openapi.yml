openapi: 3.2.0
info:
  title: Lead Bank User Credit Balance API
  description: Lead Bank's APIs
  version: v1.0
servers:
- url: https://api.sandbox.lead.bank
- url: https://api.lead.bank
security:
- bearerAuth: []
tags:
- name: User Credit Balance
paths:
  /v2/user_accounts/{user_account_id}/user_credit_balances:
    post:
      tags:
      - User Credit Balance
      operationId: create-a-user-credit-balance
      summary: Create a Credit Balance
      description: 'Create a User Credit Balance under an existing User Account. `user_account_id` comes from the URL path, not the request body. New User Credit Balances have `status: active`.'
      parameters:
      - name: user_account_id
        in: path
        required: true
        description: The parent User Account's ID
        schema:
          type: string
          pattern: ^user_account_\w+$
      - name: Idempotency-Key
        in: header
        description: Idempotency key
        required: true
        schema:
          type: string
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserCreditBalanceRequest'
      responses:
        '200':
          description: Credit Balance created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreditBalance'
        '400':
          description: The request could not be parsed, or a required header is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: request_malformed
                message: The request is invalid and cannot be parsed by the server.
                errors:
                - code: payload_invalid
                  message: The request body is not valid JSON.
        '403':
          description: 'Rejected before the request reached the User Credit Balance API. `code` is one of:

            `authentication_missing` (the request has no credentials),

            `token_invalid` (the bearer token is expired, invalid, or does not grant the required scope),

            `source_ip_not_permitted` (the request came from an IP address that is not on your program''s allowlist).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: authentication_missing
                message: The request has no authentication credentials. Send your API token in the Authorization header.
                errors:
                - code: authentication_missing
                  message: The Authorization header is missing. Send your API token as a bearer token.
                  parameters:
                  - Authorization
        '404':
          description: The parent User Account ID passed in is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: object_not_found
                message: No object exists at the requested ID, or it is not visible to this caller.
        '409':
          description: A concurrent request with the same `Idempotency-Key` is still in flight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: idempotency_key_in_use
                message: A concurrent request using this Idempotency-Key is still in flight.
        '422':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: parameters_invalid
                message: One or more parameters are invalid.
                errors:
                - code: required
                  message: name is required.
                  parameters:
                  - name
        '429':
          description: You've reached the rate limit for this call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: rate_limit_exceeded
                message: You have exceeded the rate limit for this endpoint. Retry with backoff.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: internal_server_error
                message: An unexpected error occurred. Contact support with the Request-Id header value.
        '503':
          description: The endpoint is temporarily disabled. Retry after the interval given in the `Retry-After` header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: endpoint_disabled
                message: This endpoint is temporarily disabled. Retry after the interval given in the Retry-After header.
        '504':
          description: An upstream system did not respond in time. Retry with backoff, and with the same `Idempotency-Key` on a `POST` or `PATCH`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
