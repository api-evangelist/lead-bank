components:
  schemas:
    UserCreditTransactionAmountBreakdown:
      type: object
      description: A breakdown of `amount` into its principal, interest, and fee components. The three values must sum to `amount`.
      required:
      - principal
      - interest
      - fees
      properties:
        principal:
          type: integer
          format: int64
          description: The portion of `amount` applied to principal, represented in minor units.
          example: 0
        interest:
          type: integer
          format: int64
          description: The portion of `amount` applied to interest, represented in minor units.
          example: 0
        fees:
          type: integer
          format: int64
          description: The portion of `amount` applied to fees, represented in minor units.
          example: 1500
    ErrorCode:
      type: string
      description: A snake_case code identifying the error family — the stable, machine-readable value partners branch on, together with the HTTP status.
      example: parameters_invalid
      enum:
      - request_malformed
      - content_too_large
      - idempotency_key_missing
      - authentication_missing
      - token_invalid
      - source_ip_not_allowed
      - url_invalid
      - object_not_found
      - method_not_allowed
      - idempotency_key_in_use
      - idempotency_request_inconsistent
      - rate_limit_exceeded
      - internal_server_error
      - service_unavailable
      - endpoint_disabled
      - gateway_timeout
      - unclassified
      - parameters_invalid
      - related_object_invalid
      - related_object_not_ready
      - related_object_conflict
      - limit_exceeded
      - client_control_restricted
      - lead_control_restricted
      - object_state_conflict
      - object_modified_concurrently
      - operation_invalid
    CoreTransactionID:
      type: string
      example: core_transaction_xyz123
      pattern: ^core_transaction_.+~\d+$
    UserCreditTransactionCardNetworkDetails:
      type: object
      description: Card network details associated with a `card_network`-type User Credit Transaction.
      properties:
        card_id:
          type: string
          description: The ID of the card used for the transaction.
          example: card_xyz123
        bin:
          type: string
          pattern: ^\d{6,8}$
          description: The Bank Identification Number of the card used for the transaction.
          example: '412345'
        card_network:
          type: string
          description: The card network that processed the transaction.
          example: visa
          enum:
          - visa
          - mastercard
          - pulse
          - accel
          - maestro
          - tabapay
          - amex
          - star
          - interlink
        original_transaction_id:
          type: string
          description: The card network's identifier for the original transaction this record relates to (e.g. for a clearing record referencing its authorization).
          example: user_credit_transaction_id_xyz
        network_transfer_type:
          type: string
          description: The stage of card network processing this record represents.
          example: card
          enum:
          - card
          - oct
          - aft
        authorization_amount:
          type: integer
          format: int64
          description: The amount authorized by the card network, represented in minor units.
          example: 1500
        authorization_currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        settlement_amount:
          type: integer
          format: int64
          description: The amount settled by the card network, represented in minor units.
          example: 1500
        settlement_currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        settlement_date:
          type: string
          format: date
          description: The date on which the transaction is expected to settle with the card network. Mutable via the update endpoint.
          example: '2026-09-30'
        merchant:
          $ref: '#/components/schemas/UserCreditTransactionCardNetworkMerchant'
    CreditTransactionType:
      type: string
      description: The type of the User Credit Transaction, which determines how the transaction affects the associated User Credit Balance.
      example: card_network
      enum:
      - card_network
      - funding
      - fee
      - fee_accrued
      - dispute_provisional
      - dispute_won
      - dispute_lost
      - charge_off
      - charge_off_recovery
      - rewards_earned
      - rewards_spent
      - rewards_redeemed
      - interest_accrued
      - adjustment
      - reallocation
      - payment
      - cancellation
      - client_credit
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: A human-readable description of the error family. Identical for every occurrence of a given `code`; carries no request-specific detail.
          example: One or more parameters are invalid.
        errors:
          type: array
          description: Zero or more specific errors within this family. Always present for validation errors, one entry per failing field.
          items:
            $ref: '#/components/schemas/ErrorItem'
    UserCreditTransaction:
      type: object
      required:
      - id
      - user_credit_balance_id
      - type
      - currency_code
      - amount
      - amount_breakdown
      - effective_at
      - metadata
      - created_at
      - updated_at
      - core_transaction_id
      - counterparty_core_transaction_id
      properties:
        id:
          $ref: '#/components/schemas/UserCreditTransactionID'
        user_credit_balance_id:
          type: string
          description: The ID of the User Credit Balance that this transaction belongs to.
          example: user_credit_balance_xyz123
          pattern: ^user_credit_balance_\w+$
        type:
          $ref: '#/components/schemas/CreditTransactionType'
        core_transaction_id:
          allOf:
          - $ref: '#/components/schemas/CoreTransactionID'
          description: The core transaction on the settlement (FBO) account side of this transaction's posting. Null until the transaction posts.
        counterparty_core_transaction_id:
          allOf:
          - $ref: '#/components/schemas/CoreTransactionID'
          description: The core transaction on the counterparty's operating account side of this transaction's posting. Present only when the counterparty account is a program DDA; null when the counterparty is a GL account, or until the transaction posts.
        description:
          type: string
          maxLength: 120
          description: A client-provided description of the transaction.
          example: Monthly card fee
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        amount:
          type: integer
          format: int64
          description: The transaction amount, represented in minor units. See `CreateUserCreditTransactionRequest.amount` for the per-`type` sign rules. On a transaction created by a reverse action, this is the negation of the original transaction's `amount`.
          example: 1500
        amount_in_usd:
          type: integer
          format: int64
          description: The transaction amount converted to USD, represented in minor units. On a transaction created by a reverse action, this is the negation of the original transaction's `amount_in_usd`.
          example: 1500
        amount_breakdown:
          $ref: '#/components/schemas/UserCreditTransactionAmountBreakdown'
        effective_at:
          type: string
          format: date-time
          description: An RFC 3339 timestamp representing when the transaction is effective.
          example: '2026-09-30T00:00:00Z'
        details:
          $ref: '#/components/schemas/UserCreditTransactionDetails'
        funding_id:
          type: string
          pattern: ^funding_\w+$
          description: The ID of the associated Funding object. Present when `type` is `funding`.
          example: funding_123
        reversal_transaction_id:
          type: string
          pattern: ^user_credit_transaction_\w+$
          description: The ID of the reversal User Credit Transaction created when this transaction was reversed. Present only once this transaction has been reversed.
          example: user_credit_transaction_abc789
        metadata:
          $ref: '#/components/schemas/Metadata'
        created_at:
          type: string
          format: date-time
          description: An ISO-8601 timestamp at which the User Credit Transaction was created.
          example: '2026-09-30T11:01:36Z'
        updated_at:
          type: string
          format: date-time
          description: An ISO-8601 timestamp at which the User Credit Transaction was last updated.
          example: '2026-09-30T11:05:00Z'
    UserCreditTransactionRewardsDetails:
      type: object
      description: Rewards program details associated with the User Credit Transaction. Required when `type` is `rewards_redeemed`. Required when `type` is `rewards_earned` or `rewards_spent` and the top-level `amount` is `0`.
      required:
      - amount
      - unit
      properties:
        amount:
          type: integer
          format: int64
          description: The rewards amount. Non-negative when `type` is `rewards_earned`; non-positive when `type` is `rewards_spent` or `rewards_redeemed`.
          example: 500
        unit:
          type: string
          description: The unit that `amount` is denominated in.
          example: points
          enum:
          - points
          - USD
    UserCreditTransactionDetails:
      type: object
      description: 'Additional details about the User Credit Transaction. Which properties are populated depends on the transaction `type`: `fee_type` is required when `type` is `fee`; `rewards` is required when `type` is `rewards_redeemed`, `rewards_earned`, or `rewards_spent`; `card_network` is present when `type` is `card_network`; `reversal` is present only on a transaction created by a reverse action.'
      properties:
        fee_type:
          $ref: '#/components/schemas/CreditTransactionFeeType'
        card_network:
          $ref: '#/components/schemas/UserCreditTransactionCardNetworkDetails'
        rewards:
          $ref: '#/components/schemas/UserCreditTransactionRewardsDetails'
        reversal:
          $ref: '#/components/schemas/UserCreditTransactionReversalDetails'
    UserCreditTransactionID:
      type: string
      description: The ID of the User Credit Transaction object.
      example: user_credit_transaction_xyz123
      pattern: ^user_credit_transaction_\w+$
    CurrencyCode:
      description: A three-letter currency code as defined in ISO 4217.
      type: string
      example: USD
      enum:
      - USD
    UpdateUserCreditTransactionRequest:
      type: object
      additionalProperties: false
      description: 'Request body for updating an existing User Credit Transaction. Only mutable fields are present

        — amount-row fields (`amount`, `amount_breakdown`, `type`, `currency_code`, `effective_at`,

        `funding_id`) and other immutable fields aren''t in this schema at all, so they''re rejected the

        same way any unrecognized field is.'
      properties:
        description:
          type: string
          maxLength: 120
          description: An optional, client-provided description of the transaction. Limited to 120 characters.
          example: Monthly card fee
        metadata:
          $ref: '#/components/schemas/Metadata'
        details:
          type: object
          additionalProperties: false
          properties:
            card_network:
              type: object
              additionalProperties: false
              properties:
                settlement_date:
                  type: string
                  format: date
                  description: The date on which the transaction is expected to settle with the card network.
                  example: '2026-09-30'
    ErrorItem:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: A snake_case code naming the specific error or sub-category.
          example: required
        message:
          type: string
          description: A human-readable description of this specific error, with interpolated values where relevant.
          example: account_number_id is required.
        parameters:
          type: array
          description: The request fields this error implicates, in dot notation for nested fields. Present for validation errors.
          items:
            type: string
          example:
          - account_number_id
    UserCreditTransactionCardNetworkMerchant:
      type: object
      description: Merchant details associated with a `card_network`-type User Credit Transaction.
      properties:
        name:
          type: string
          description: The name of the merchant. Required when `details.card_network.network_transfer_type` is `card`.
          example: Acme Inc.
        address_line_1:
          type: string
          description: The street address of the merchant. Optional; no format constraint.
          example: 123 Main St
        city:
          type: string
          description: The city of the merchant. Optional; no format constraint.
          example: Kansas City
        state:
          type: string
          description: The state of the merchant. Optional; no format constraint.
          example: MO
        country_code:
          type: string
          pattern: ^[A-Z]{2}$
          description: The two-letter ISO 3166-1 country code of the merchant. Required when `details.card_network.network_transfer_type` is `card`.
          example: US
        zip_code:
          type: string
          description: The postal code of the merchant. Optional; no format constraint.
          example: '64105'
        mcc:
          type: string
          pattern: ^\d{4}$
          description: The Merchant Category Code for the transaction. Required when `details.card_network.network_transfer_type` is `card`.
          example: '5411'
    CreditTransactionFeeType:
      type: string
      description: The category of fee represented by this transaction. Required when `type` is `fee`.
      example: card
      enum:
      - periodic_maintenance
      - card
      - international_transaction
      - borrower_origination
      - other
    CreateUserCreditTransactionRequest:
      type: object
      description: Request body for creating a new User Credit Transaction.
      additionalProperties: false
      required:
      - type
      - currency_code
      - amount
      - amount_breakdown
      - effective_at
      properties:
        type:
          $ref: '#/components/schemas/CreditTransactionType'
        description:
          type: string
          maxLength: 120
          description: An optional, client-provided description of the transaction. Limited to 120 characters.
          example: Monthly card fee
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        amount:
          type: integer
          format: int64
          description: "The transaction amount, represented in minor units. Sign rules and `amount_breakdown` treatment depend on `type`:\n  - Non-negative (`>= 0`), rule applies to `amount` and all of `amount_breakdown.principal`/`.interest`/`.fees`: `dispute_lost`\n  - Non-negative (`>= 0`), rule applies to `amount` and `amount_breakdown.interest` only; `amount_breakdown.principal` and `.fees` are forced to `0`: `funding`, `interest_accrued`\n  - Non-negative (`>= 0`); `amount_breakdown.principal` and `.interest` are forced to `0`: `fee`\n  - Strictly positive (`> 0`); `amount_breakdown.principal` and `.interest` are forced to `0`: `fee_accrued`\n  - Non-positive (`<= 0`), rule applies to `amount` and all of `amount_breakdown.principal`/`.interest`/`.fees`: `payment`, `dispute_provisional`, `charge_off`, `rewards_redeemed`, `cancellation`, `client_credit`, `dispute_won`, `charge_off_recovery`\n  - Exactly `0`, and all of `amount_breakdown.principal`/`.interest`/`.fees` forced to `0`: `rewards_earned`, `rewards_spent` (the signed rewards value instead lives in `details.rewards.amount`)\n  - Exactly `0` at the top level only; `amount_breakdown` components may be nonzero as long as they sum to `0`: `reallocation`\n  - Unconstrained: `card_network`, `adjustment`"
          example: 1500
        amount_breakdown:
          $ref: '#/components/schemas/UserCreditTransactionAmountBreakdown'
        effective_at:
          type: string
          format: date-time
          description: An RFC 3339 timestamp representing when the transaction is effective. Must fall within the current or prior calendar quarter.
          example: '2026-09-30T00:00:00Z'
        details:
          $ref: '#/components/schemas/UserCreditTransactionDetails'
        funding_id:
          type: string
          pattern: ^funding_\w+$
          description: The ID of the associated Funding object. Required when `type` is `funding`, and must be absent otherwise.
          example: funding_123
        metadata:
          $ref: '#/components/schemas/Metadata'
    Metadata:
      type: object
      additionalProperties:
        type: string
      description: A set of key-value pairs that can be used to store additional information related to this object.
    UserCreditTransactionReversalDetails:
      type: object
      description: Present only on a User Credit Transaction created by a reverse action.
      required:
      - original_transaction_id
      properties:
        original_transaction_id:
          $ref: '#/components/schemas/UserCreditTransactionID'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
