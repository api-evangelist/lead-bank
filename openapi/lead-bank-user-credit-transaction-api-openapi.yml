  /v2/user_credit_transactions/{user_credit_transaction_id}/reverse:
    post:
      tags:
      - User Credit Transaction
      operationId: reverse-a-user-credit-transaction-v2
      summary: Reverse a User Credit Transaction
      description: Reverse a User Credit Transaction. Lead creates and returns a new User Credit Transaction of the same `type` with every amount negated, linked to the original. See Reversals.
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key
        required: true
        schema:
          type: string
          minLength: 5
          maxLength: 255
      - name: user_credit_transaction_id
        in: path
        required: true
        example: user_credit_transaction_xyz123
        schema:
          type: string
          pattern: ^user_credit_transaction_\w+$
        description: The ID of the User Credit Transaction to be reversed.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  $ref: '#/components/schemas/Metadata'
      responses:
        '200':
          description: The newly created reversal User Credit Transaction object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreditTransaction'
        '400':
          description: We couldn't parse your request body, please check that your request body is valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: request_malformed
                message: The request is invalid and cannot be parsed by the server.
                errors:
                - code: payload_invalid
                  message: The request body is not valid JSON.
        '403':
          description: 'Rejected before the request reached the User Credit Transaction API. `code` is one of:

            `authentication_missing` (the request has no credentials),

            `token_invalid` (the bearer token is expired, invalid, or does not grant the required scope),

            `source_ip_not_permitted` (the request came from an IP address that is not on your program''s allowlist).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: authentication_missing
                message: The request has no authentication credentials. Send your API token in the Authorization header.
                errors:
                - code: authentication_missing
                  message: The Authorization header is missing. Send your API token as a bearer token.
                  parameters:
                  - Authorization
        '404':
          description: The user_credit_transaction_id passed in is not a valid User Credit Transaction ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: object_not_found
                message: No object exists at the requested ID, or it is not visible to this caller.
        '409':
          description: '`code` is one of:

            `idempotency_key_in_use` (a concurrent request with the same `Idempotency-Key` is still in flight),

            `object_modified_concurrently` (another request changed the transaction while this one was processing; fetch it and retry).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: idempotency_key_in_use
                message: A concurrent request using this Idempotency-Key is still in flight.
        '422':
          description: Your request parameters did not validate, or the transaction is not eligible for reversal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: object_state_conflict
                message: The object is not in the state this request assumed. Fetch its current state before retrying.
                errors:
                - code: object_status_unchanged
                  message: User Credit Transaction user_credit_transaction_xyz123 is already reversed.
        '429':
          description: Too many requests. Please retry after some time.
          content:
