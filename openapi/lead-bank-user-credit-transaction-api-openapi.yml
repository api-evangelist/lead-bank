openapi: 3.2.0
info:
  title: Lead Bank User Credit Transaction API
  description: Lead Bank's APIs
  version: v1.0
servers:
- url: https://api.sandbox.lead.bank
- url: https://api.lead.bank
security:
- bearerAuth: []
tags:
- name: User Credit Transaction
paths:
  /v2/user_credit_balances/{user_credit_balance_id}/user_credit_transactions:
    post:
      tags:
      - User Credit Transaction
      operationId: create-a-user-credit-transaction-v2
      summary: Create a User Credit Transaction
      description: Create a User Credit Transaction on a User Credit Balance.
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key
        required: true
        schema:
          type: string
          minLength: 5
          maxLength: 255
      - name: user_credit_balance_id
        in: path
        required: true
        example: user_credit_balance_xyz123
        schema:
          type: string
          pattern: ^user_credit_balance_\w+$
        description: The ID of the User Credit Balance to create the transaction against.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserCreditTransactionRequest'
      responses:
        '200':
          description: The created User Credit Transaction object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreditTransaction'
        '400':
          description: We couldn't parse your request body, please check that your request body is valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: request_malformed
                message: The request is invalid and cannot be parsed by the server.
                errors:
                - code: payload_invalid
                  message: The request body is not valid JSON.
        '403':
          description: 'Rejected before the request reached the User Credit Transaction API. `code` is one of:

            `authentication_missing` (the request has no credentials),

            `token_invalid` (the bearer token is expired, invalid, or does not grant the required scope),

            `source_ip_not_permitted` (the request came from an IP address that is not on your program''s allowlist).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: authentication_missing
                message: The request has no authentication credentials. Send your API token in the Authorization header.
                errors:
                - code: authentication_missing
                  message: The Authorization header is missing. Send your API token as a bearer token.
                  parameters:
                  - Authorization
        '404':
          description: The user_credit_balance_id passed in is not a valid User Credit Balance ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: object_not_found
                message: No object exists at the requested ID, or it is not visible to this caller.
        '409':
          description: A concurrent request with the same `Idempotency-Key` is still in flight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: idempotency_key_in_use
                message: A concurrent request using this Idempotency-Key is still in flight.
        '422':
          description: Your request parameters did not validate, or this `Idempotency-Key` was used with a different request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: parameters_invalid
                message: One or more parameters are invalid.
                errors:
                - code: required
                  message: amount_breakdown.principal is required.
                  parameters:
                  - amount_breakdown.principal
                - code: dependent_parameter_required
                  message: details.fee_type is required when type is fee.
                  parameters:
                  - details.fee_type
        '429':
          description: Too many requests. Please retry after some time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: rate_limit_exceeded
                message: You have exceeded the rate limit for this endpoint. Retry with backoff.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: internal_server_error
                message: An unexpected error occurred. Contact support with the Request-Id header value.
        '503':
          description: The endpoint is temporarily disabled. Retry after the interval given in the `Retry-After` header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: endpoint_disabled
                message: This endpoint is temporarily disabled. Retry after the interval given in the Retry-After header.
        '504':
          description: An upstream system did not respond in time. Retry with backoff, and with the same `Idempotency-Key` on a `POST` or `PATCH`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: gateway_timeout
                message: An upstream system timed out. Retry with backoff.
  /v2/user_credit_transactions/{user_credit_transaction_id}:
    get:
      tags:
      - User Credit Transaction
      operationId: retrieve-a-user-credit-transaction-v2
      summary: Retrieve a User Credit Transaction
      description: Retrieve a User Credit Transaction by its ID.
      parameters:
      - name: user_credit_transaction_id
        in: path
        required: true
        example: user_credit_transaction_xyz123
        schema:
          type: string
          pattern: ^user_credit_transaction_\w+$
        description: The ID of the User Credit Transaction to be retrieved.
      responses:
        '200':
          description: A User Credit Transaction object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreditTransaction'
        '400':
          description: The request URL could not be parsed (`request_malformed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: request_malformed
                message: The request is invalid and cannot be parsed by the server.
                errors:
                - code: url_malformed
                  message: The request URL could not be parsed.
        '403':
          description: 'Rejected before the request reached the User Credit Transaction API. `code` is one of:

            `authentication_missing` (the request has no credentials),

            `token_invalid` (the bearer token is expired, invalid, or does not grant the required scope),

            `source_ip_not_permitted` (the request came from an IP address that is not on your program''s allowlist).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: authentication_missing
                message: The request has no authentication credentials. Send your API token in the Authorization header.
                errors:
                - code: authentication_missing
                  message: The Authorization header is missing. Send your API token as a bearer token.
                  parameters:
                  - Authorization
        '404':
          description: The user_credit_transaction_id passed in is not a valid User Credit Transaction ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: object_not_found
                message: No object exists at the requested ID, or it is not visible to this caller.
        '422':
          description: 'The request was parsed but cannot be processed. `code` is one of:

            `parameters_invalid` (the User Credit Transaction ID is malformed).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: parameters_invalid
                message: One or more parameters are invalid.
                errors:
                - code: value_malformed
                  message: user_credit_transaction_id is not a valid ID.
                  parameters:
                  - user_credit_transaction_id
        '429':
          description: Too many requests. Please retry after some time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: rate_limit_exceeded
                message: You have exceeded the rate limit for this endpoint. Retry with backoff.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: internal_server_error
                message: An unexpected error occurred. Contact support with the Request-Id header value.
        '503':
          description: The endpoint is temporarily disabled. Retry after the interval given in the `Retry-After` header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: endpoint_disabled
                message: This endpoint is temporarily disabled. Retry after the interval given in the Retry-After header.
        '504':
          description: An upstream system did not respond in time. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: gateway_timeout
                message: An upstream system timed out. Retry with backoff.
    patch:
      tags:
      - User Credit Transaction
      operationId: update-a-user-credit-transaction-v2
      summary: Update a User Credit Transaction
      description: Update a User Credit Transaction.
      parameters:
      - name: Idempotency-Key
        in: header
