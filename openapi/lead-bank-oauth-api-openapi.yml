openapi: 3.2.0
info:
  title: Lead Bank OAuth API
  description: Lead Bank's APIs
  version: v1.0
servers:
- url: https://api.sandbox.lead.bank
- url: https://api.lead.bank
security:
- bearerAuth: []
tags:
- name: OAuth
paths:
  /v1/oauth/token:
    post:
      security: []
      tags:
      - OAuth
      operationId: get-an-access-token
      summary: Get an Access Token
      description: Exchange your client credentials for an access code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - grant_type
              - client_id
              - client_secret
              properties:
                grant_type:
                  description: The type of access token you want to request.
                  type: string
                  enum:
                  - client_credentials
                client_id:
                  description: Your client ID.
                  type: string
                  example: <client_id>
                client_secret:
                  description: Your client secret.
                  type: string
                  example: <client_secret>
                scope:
                  description: A space delimited list of scopes your access token should be provisioned to allow.
                  type: string
                  example: ach/read
                  enum:
                  - account_number/read
                  - account_number/read_write
                  - ach/read
                  - ach/read_write
                  - wire/read
                  - wire/read_write
                  - instant_payment/read
                  - instant_payment/read_write
                  - event/read
                  - internal_transfer/read
                  - internal_transfer/read_write
                  - lending/read
                  - lending/read_write
                  - entity/read
                  - entity/read_write
                  - funding/read
                  - funding/read_write
                  - subledger_balance/read
                  - subledger_balance/read_write
                  - account/read
                  - account/read_write
                  - application/read
                  - application/read_write
                  - blockchain_payment/read
                  - blockchain_payment/read_write
                  - card/read
                  - card/read_write
      responses:
        '200':
          description: Successful token exchange
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    description: A Base64 access token.
                    type: string
                    example: AN_ACCESS_TOKEN
                  token_type:
                    description: The token type.
                    type: string
                    example: Bearer
                  scope:
                    description: A space delimited list of scopes your access token is provisioned for.
                    type: string
                    example: ach/read account_number/read
                  expires_in:
                    description: The number of seconds the access token will expire in.
                    type: integer
                    example: 86400
        '400':
          description: Bad request. Invalid parameters in request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: HTTP status code of the response.
                    example: 400
                  code:
                    type: string
                    description: Error code.
                    example: parameters_invalid
                  title:
                    type: string
                    description: High level description of the error `code`.
                    example: Your request body did not parse.
                  detail:
                    type: string
                    description: Why the parameter is invalid.
                    example: Invalid grant type.
        '403':
          description: Your program is not provisioned for one or more of the requested scopes. Scopes are provisioned by Lead; contact support@lead.bank to request access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example:
                status: '403'
                code: insufficient_scope
                title: Your program is not provisioned for one or more of the requested scopes.
                detail: Scopes are provisioned by Lead. Check the documented scopes for this endpoint and contact support@lead.bank to request access.
                invalid_parameters:
                - parameter: scope
                  reason: invalid_value
components:
  schemas:
    InvalidParameterDetail:
      type: object
      properties:
        parameter:
          type: string
          description: Which parameter is invalid.
          example: transaction_type
        reason:
          type: string
          description: Why the parameter is invalid.
    APIError:
      type: object
      properties:
        code:
          type: string
          description: The error code.
        title:
          type: string
          description: The error title.
        detail:
          type: string
          description: A detailed error description.
        status:
          type: string
          description: The HTTP status code.
        invalid_parameters:
          type: array
          description: Invalid request parameters with reasons, if applicable.
          items:
            $ref: '#/components/schemas/InvalidParameterDetail'
        instance:
          type: string
          description: The object causing this specific occurrence of the error, if applicable.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-provenance:
  method: harvested
  publisher: Lead Bank
  source: https://docs.lead.bank/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
