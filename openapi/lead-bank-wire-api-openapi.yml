      - domestic
      - international
    WireStatus:
      description: The current status of the wire object.
      type: string
      example: created
      enum:
      - created
      - scheduled
      - processing
      - posted
      - under_review
      - rejected
      - canceled
      - cancel_pending
    WireOtherAgents:
      description: Details of any other agents involved in the wire transfer.
      type: object
      properties:
        previous_instructing_agent_one:
          $ref: '#/components/schemas/WireAgent'
          description: Object representing the “Previous Instructing Agent One”, which is a financial institution sitting in the payment chain between the Debtor Agent and the Instructing Agent.
        previous_instructing_agent_two:
          $ref: '#/components/schemas/WireAgent'
          description: Object representing the “Previous Instructing Agent Two”, which is a financial institution sitting in the payment chain between the Debtor Agent and the Instructing Agent.
        previous_instructing_agent_three:
          $ref: '#/components/schemas/WireAgent'
          description: Object representing the “Previous Instructing Agent Three”, which is a financial institution sitting in the payment chain between the Debtor Agent and the Instructing Agent.
        intermediary_agent_one:
          $ref: '#/components/schemas/WireAgent'
          description: Object representing the “Intermediary Agent One”, which is a financial institution sitting in the payment chain between the Creditor Agent and the Instructed Agent.
        intermediary_agent_two:
          $ref: '#/components/schemas/WireAgent'
          description: Object representing the “Intermediary Agent Two”, which is a financial institution sitting in the payment chain between the Creditor Agent and the Instructed Agent.
        intermediary_agent_three:
          $ref: '#/components/schemas/WireAgent'
          description: Object representing the “Intermediary Agent Three”, which is a financial institution sitting in the payment chain between the Creditor Agent and the Instructed Agent.
    CreateAWireRequestBodyV2:
      title: Create a wire
      type: object
      required:
      - account_number_id
      - corridor_type
      - amount
      - currency_code
      - creditor_agent
      - creditor
      - remittance_details
      properties:
        account_number_id:
          $ref: '#/components/schemas/AccountNumberID'
        corridor_type:
          $ref: '#/components/schemas/CorridorType'
        amount:
          $ref: '#/components/schemas/WireAmount'
          description: The amount of the wire in the currency's minor units.
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        creditor_agent:
          $ref: '#/components/schemas/WireAgentRequestV2'
          description: The financial institution where the creditor (payee) holds their account. When `corridor_type` is `domestic`, `local_routing_identifier` is required; when `international`, `business_identifier_code` is required.
        creditor:
          $ref: '#/components/schemas/WireCreditorRequestV2'
        instructed_agent:
          $ref: '#/components/schemas/WireAgentRequestV2'
          description: The financial institution that receives the payment via Fedwire. For international wires, this specifies the immediate intermediary in the payment chain following the instructing agent.
        ultimate_debtor:
          $ref: '#/components/schemas/WireUltimateDebtorRequest'
        remittance_details:
          type: object
          description: Remittance details of the creditor.
          required:
          - transfer_purpose
          properties:
            message_to_creditor:
              type: string
              description: Information intended specifically for the creditor.
              example: Payment for invoice 12345
              maxLength: 140
              pattern: ^[ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]\n]*$
            transfer_purpose:
              $ref: '#/components/schemas/WireTransferPurposeV1'
        payment_identifiers:
          type: object
          description: Payment identifiers of the creditor.
          properties:
            end_to_end_identification:
              type: string
              description: Unique identification that the initiating party in a wire message can use to unambiguously identify the transaction. This is passed through, unchanged, throughout the entire wire chain.
              maxLength: 35
              pattern: ^[ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*$
              example: EndtoEnd12345
        metadata:
          $ref: '#/components/schemas/Metadata'
    WireAgent:
      type: object
      description: Wire agent information.
      properties:
        business_identifier_code:
          type: string
          description: Business Identifier Code (BIC) of the financial institution.
          example: BOFAUS3NXXX
        name:
          type: string
          description: Name of the financial institution.
          example: Bank of America
        routing_number:
          type: string
          description: Nine-character numeric ABA routing number of the financial institution.
        address:
          description: Address of the financial institution.
          $ref: '#/components/schemas/WirePostalAddress'
        local_routing_identifier:
          $ref: '#/components/schemas/LocalRoutingIdentifier'
    RelatedWiresV1:
      type: object
      description: Related wire objects.
      properties:
        original_wire_id:
          type: string
          description: If this wire is a return wire (i.e., returning a wire previously received), this field will provide the preceding wire's identifier (wire_id).
          example: wire_xyz001
        return_wire_ids:
          type: array
          description: If this wire has been returned by any following wires, you can find the returning wire id(s) here.
          items:
            type: string
            example: wire_xyz002
    WireUltimateDebtorRequest:
      type: object
      description: The ultimate party on whose behalf the payment is made, if different from the debtor.
      properties:
        name:
          type: string
          description: Name of the ultimate debtor.
          minLength: 1
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
          example: John Smith
    WirePostalAddress:
      type: object
      properties:
        department:
          type: string
          description: Identification of a division of a large organization or building.
          example: Procurement Department
        sub_department:
          type: string
          description: Identification of a sub-division of a large organization or building.
          example: IT Procurement
        street_name:
          type: string
          description: Name of a street or thoroughfare.
          example: Main Street
        building_number:
          type: string
          description: Number that identifies the position of a building on a street.
          example: '100'
        building_name:
          type: string
          description: Name of the building or house.
          example: City Hall
        floor:
          type: string
          description: Floor or storey within a building.
          example: 4th Floor
        post_box:
          type: string
          description: Numbered box in a post office, assigned to a person or organisation, where letters are kept until called for.
          example: PO Box 12345
        room:
          type: string
          description: Building room number.
          example: '600'
        post_code:
          type: string
          description: Identifier consisting of a group of letters and/or numbers that is added to a postal address to assist the sorting of mail.
          example: '12345'
        town_name:
          type: string
          description: Name of a built-up area, with defined boundaries, and a local government.
          example: Kansas City
        town_location_name:
          type: string
          description: Specific location name within the town. Note that this field is not commonly used for US-based addresses.
          example: Westside North
        district_name:
          type: string
          description: Identifies a subdivision within a country sub-division. Note that this field is not commonly used for US-based addresses.
          example: Manhattan
        country_sub_division:
          type: string
          description: Identifies a subdivision of a country such as state, region, county.
          example: NY
        country:
          type: string
          description: ISO 3166, alpha-2 code representing a nation with its own government.
          example: US
          pattern: '[A-Z]{2,2}'
        line_one:
          type: string
          description: Line one address of the party represented in an unstructured format.
          maxLength: 70
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
          example: 123 Main St
        line_two:
          type: string
          description: Line two address of the party represented in an unstructured format.
          maxLength: 70
          pattern: ^[ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*$
          example: Suite 100
        line_three:
          type: string
          description: Line three address of the party represented in an unstructured format.
          maxLength: 35
          pattern: ^[ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*$
          example: Kansas City, MO 64105
    WireReturnV1:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/WireReturnReasonEnum'
          description: If wire is a return, this field will indicate the reason for the return
        code:
          type: string
          description: The return code for the wire return.
        additional_information:
          type: string
          description: If the return reason is NARR (stands for “narrative”), then an accompanying free-form explanation is required and will appear here. For other reasons, participants may optionally send additional information as well.
    WireReturnRequestResolution:
      type: object
