openapi: 3.2.0
info:
  title: Lead Bank Wire API
  description: Lead Bank's APIs
  version: v1.0
servers:
- url: https://api.sandbox.lead.bank
- url: https://api.lead.bank
security:
- bearerAuth: []
tags:
- name: Wire
paths:
  /v1/wires/{wire_id}:
    get:
      tags:
      - Wire
      operationId: retrieve-a-wire-v1
      summary: Retrieve a wire V1
      description: Retrieve a wire object.
      parameters:
      - name: wire_id
        description: ID of the wire object you want to retrieve.
        example: wire_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^wire_\w+$
      responses:
        '200':
          description: A wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireV1'
        '403':
          description: You do not have permission to access this wire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: wire_id passed in is not a valid external wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    patch:
      tags:
      - Wire
      operationId: update-a-wire-v1
      summary: Update a wire V1
      description: Update a wire.
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key
        required: true
        schema:
          type: string
          maxLength: 255
      - name: wire_id
        description: ID of the wire object you want to update.
        example: wire_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^wire_\w+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  $ref: '#/components/schemas/Metadata'
      responses:
        '200':
          description: Updated wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireV1'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: You do not have permission to access this wire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: wire_id passed in is not a valid wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: We couldn't parse your request body, please check that your request body is valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/wires:
    get:
      tags:
      - Wire
      operationId: list-all-wires-v1
      summary: List all wires V1
      description: List all wire objects.
      parameters:
      - name: account_id
        description: Returns wires associated with this `account_id`.
        in: query
        schema:
          type: string
          pattern: ^account_\w+$
      - name: account_number_id
        description: Returns wires associated with this `account_number_id`.
        in: query
        schema:
          type: string
          pattern: ^account_number_\w+$
      - name: end_to_end_identification
        description: Returns wires associated with this `end_to_end_identification`.
        in: query
        schema:
          type: string
          maxLength: 35
      - name: direction
        description: Returns wires with this `direction`.
        in: query
        schema:
          $ref: '#/components/schemas/WireDirection'
      - name: status
        description: Returns wires with this `status`.
        in: query
        schema:
          $ref: '#/components/schemas/WireStatus'
      - name: return_request_status
        description: Returns wires that have a return request with this status. Only wires where the matching return request is visible to the client are returned.
        in: query
        schema:
          $ref: '#/components/schemas/WireReturnRequestStatus'
      - name: created_at
        description: A set of filters on the list using the object’s field `created_at`.
        in: query
        style: deepObject
        explode: true
        schema:
          type: object
          properties:
            after:
              type: string
              format: date-time
              description: Returns objects where the `created_at` timestamp is after the entered timestamp.
            on_or_after:
              type: string
              format: date-time
              description: Returns objects where the `created_at` timestamp is the same as or after the entered timestamp.
            before:
              type: string
              format: date-time
              description: Returns objects where the `created_at` timestamp is before the entered timestamp.
            on_or_before:
              type: string
              format: date-time
              description: Returns objects where the `created_at` timestamp is the same as or before the entered timestamp.
      - name: limit
        description: Maximum number of objects to be returned.
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: starting_after
        description: A cursor for use in pagination; this is an ID that defines your place in the list.
        in: query
        schema:
          type: string
          pattern: ^wire_\w+$
      - name: ending_before
        description: A cursor for use in pagination; this is an ID that defines your place in the list.
        in: query
        schema:
          type: string
          pattern: ^wire_\w+$
      responses:
        '200':
          description: A list of wire objects.
          content:
            application/json:
              schema:
                type: object
                required:
                - objects
                - has_more
                properties:
                  objects:
                    type: array
                    items:
                      $ref: '#/components/schemas/WireV1'
                  has_more:
                    type: boolean
                    description: Indicates whether more results are available.
        '403':
          description: You do not have permission to access wires.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: Your request parameters did not validate. Please confirm your query param.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    post:
      tags:
      - Wire
      operationId: create-a-wire-v1
      summary: Create a wire V1
      description: Create a new outgoing wire.
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key
        required: true
        schema:
          type: string
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account_number_id
              - amount
              - currency_code
              - creditor_agent
              - creditor
              - remittance_details
              properties:
                account_number_id:
                  $ref: '#/components/schemas/AccountNumberID'
                amount:
                  $ref: '#/components/schemas/WireAmount'
                  description: The amount of the wire in cents.
                currency_code:
                  $ref: '#/components/schemas/CurrencyCode'
                creditor_agent:
                  $ref: '#/components/schemas/WireAgentRequest'
                  description: The financial institution receiving the wire from Fedwire.
                creditor:
                  $ref: '#/components/schemas/WireCreditorRequest'
                remittance_details:
                  type: object
                  description: Remittance details of the creditor.
                  required:
                  - transfer_purpose
                  properties:
                    message_to_creditor:
                      type: string
                      description: Information intended specifically for the creditor.
                      example: Payment for invoice 12345
                      maxLength: 140
                      pattern: ^[ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]\n]*$
                    transfer_purpose:
                      $ref: '#/components/schemas/WireTransferPurposeV1'
                payment_identifiers:
                  type: object
                  description: Payment identifiers of the creditor.
                  properties:
                    end_to_end_identification:
                      type: string
                      description: Unique identification that the initiating party in a wire message can use to unambiguously identify the transaction. This is passed through, unchanged, throughout the entire wire chain.
                      maxLength: 35
                      pattern: ^[ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*$
                      example: EndtoEnd12345
                instructed_agent:
                  $ref: '#/components/schemas/WireAgentRequest'
                  description: The financial institution that receives the payment via Fedwire. For international wires, this field is primarily used to specify the immediate intermediary in the payment chain following the instructing agent.
                metadata:
                  $ref: '#/components/schemas/Metadata'
      responses:
        '200':
          description: The new outgoing wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireV1'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: You do not have permission to access this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: We couldn't parse your request body, please check that your request body is valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/wires/{wire_id}/return:
    post:
      tags:
      - Wire
      operationId: return-a-wire-v1
      summary: Return a wire V1
      description: Initiate a return against an incoming wire.
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key
        required: true
        schema:
          type: string
          maxLength: 255
      - name: wire_id
        description: ID of the wire object you want to return.
        example: wire_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^wire_\w+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - return_code
              properties:
                return_code:
                  $ref: '#/components/schemas/WireReturnCode'
                return_additional_information:
                  type: string
                  description: Additional details about why the wire is being returned that will be included with the returned wire.
                  minLength: 1
                  maxLength: 105
                  pattern: ^[ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*[\w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]][ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*$
                amount:
                  $ref: '#/components/schemas/WireAmount'
                  description: The amount to be returned in cents. If not provided, the original wire amount will be used.
                metadata:
                  $ref: '#/components/schemas/Metadata'
      responses:
        '200':
          description: The new outgoing return wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireV1'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: You do not have permission to access wires..
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: wire_id passed in is not a valid wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: We couldn't parse your request body, please check that your request body is valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/wires/{wire_id}/request_return:
    post:
      tags:
      - Wire
      operationId: request-return-for-wire-v1
      summary: Request return for a wire V1
      description: 'Send a return request (camt.056) to the counterparty financial institution for a previously sent outgoing wire.

        Returns the updated wire object with a new entry in the `return_requests` array in `pending` status.'
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key
        required: true
        schema:
          type: string
          maxLength: 255
      - name: wire_id
        description: ID of the outgoing wire you want to request a return for.
        example: wire_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^wire_\w+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  $ref: '#/components/schemas/WireOutgoingReturnRequestReason'
                  description: The reason for the return request.
                additional_information:
                  type: string
                  maxLength: 210
                  pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
                  description: Free-text explanation accompanying the return request. Required if `reason` is `narrative` or `wrong_amount`.
      responses:
        '200':
          description: The updated wire object with a new return request in the `return_requests` array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireV1'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: You do not have permission to access this wire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: wire_id passed in is not a valid wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: We couldn't parse your request body, please check that your request body is valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/wires/{wire_id}/reject_return_request:
    post:
      tags:
      - Wire
      operationId: reject-return-request-for-wire-v1
      summary: Reject a return request
      description: Reject the currently active incoming return request associated with the wire.
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key
        required: true
        schema:
          type: string
          maxLength: 255
      - name: wire_id
        description: ID of the wire whose active incoming return request you want to reject.
        example: wire_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^wire_\w+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  $ref: '#/components/schemas/WireReturnRequestRejectionReason'
                  description: The reason for rejecting the incoming return request.
                additional_information:
                  type: string
                  maxLength: 105
                  pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
                  description: Accompanying free text explanation for the reason. Required when `reason` is `narrative`.
      responses:
        '200':
          description: The updated wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireV1'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: You do not have permission to access this wire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: The specified wire ID was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: We couldn't parse your request body, please check that your request body is valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/wires/{wire_id}/cancel:
    post:
      tags:
      - Wire
      operationId: cancel-a-wire-v1
      summary: Cancel a wire V1
      description: Cancel a wire object.
