      properties:
        id:
          type: string
          description: Unique identifier of the wire object.
          example: wire_xyz123
          pattern: ^wire_\w+$
        account_number_id:
          $ref: '#/components/schemas/AccountNumberID'
        core_transaction_id:
          type:
          - string
          - 'null'
          description: Linked core transaction ID associated with the wire.
          example: core_transaction_xyz123
        created_at:
          type: string
          format: date-time
          description: ISO 8601 format timestamp representing when the wire object was created.
          example: '2024-06-27T11:22:33Z'
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 format timestamp representing when the wire object was last updated.
          example: '2024-06-27T11:22:33Z'
        settlement_date:
          type: string
          format: date
          description: The ISO-8601 datestamp indicating the wire settlement date based on Fedwire's business day definition.
          example: '2024-06-27'
        direction:
          $ref: '#/components/schemas/WireDirection'
        type:
          type: string
          description: Indicates the type of wire message that the object represents.
          example: transfer
          enum:
          - transfer
          - return
        corridor_type:
          $ref: '#/components/schemas/CorridorType'
        status:
          $ref: '#/components/schemas/WireStatus'
        amounts:
          $ref: '#/components/schemas/WireAmounts'
        debtor:
          $ref: '#/components/schemas/WireParty'
          description: Details of the debtor sending funds.
        debtor_agent:
          $ref: '#/components/schemas/WireAgentV2'
          description: Details of the financial institution where the debtor holds their account. This object may be absent if the instructing agent does not provide this information.
        instructing_agent:
          $ref: '#/components/schemas/WireInstructAgentV2'
          description: The financial institution that transmitted the payment through Fedwire. In some cases, this may differ from the bank where the account is held. This object will always be populated.
        instructed_agent:
          $ref: '#/components/schemas/WireInstructAgentV2'
          description: The financial institution that received the payment through Fedwire. This may not always be the bank where the recipient's account is held. This object will always be populated.
        creditor_agent:
          $ref: '#/components/schemas/WireAgentV2'
          description: Details of the financial institution where the creditor holds their account. This object may be absent if the instructing agent does not provide this information.
        creditor:
          $ref: '#/components/schemas/WireParty'
          description: Details of the creditor receiving funds.
        initiating_party:
          $ref: '#/components/schemas/WireParty'
          description: Details of the party that initiates the payment on behalf of the debtor. For outgoing wires, automatically populated with your organization's name. For incoming wires, populated from the ISO initiating party when provided by the sending institution.
        ultimate_debtor:
          $ref: '#/components/schemas/WireParty'
          description: The ultimate party on whose behalf the payment is made, if different from the debtor.
        ultimate_creditor:
          $ref: '#/components/schemas/WireParty'
          description: The ultimate party to which the payment is intended, if different from the creditor.
        other_agents:
          $ref: '#/components/schemas/WireOtherAgentsV2'
        payment_identifiers:
          $ref: '#/components/schemas/WirePaymentIdentifiers'
        remittance_details:
          $ref: '#/components/schemas/WireRemittanceDetails'
        charges:
          $ref: '#/components/schemas/WireChargesV2'
          description: Information about any charges assessed during wire transfer processing.
        related_wires:
          $ref: '#/components/schemas/RelatedWiresV1'
        return_requests:
          type: array
          description: Return requests associated with the wire, sorted oldest first. Empty when no return requests exist.
          items:
            $ref: '#/components/schemas/WireReturnRequest'
        return:
          $ref: '#/components/schemas/WireReturnV2'
        rejection:
          $ref: '#/components/schemas/WireRejectionReasonV1'
        metadata:
          $ref: '#/components/schemas/Metadata'
