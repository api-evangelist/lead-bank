      operationId: return-a-wire-v2
      summary: Return a wire V2
      description: Initiate a return against an incoming wire.
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key
        required: true
        schema:
          type: string
          maxLength: 255
      - name: wire_id
        description: ID of the wire object you want to return. May be an incoming transfer wire or an incoming return wire.
        example: wire_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^wire_\w+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  $ref: '#/components/schemas/WireReturnReasonV2'
                return_additional_information:
                  type: string
                  description: Additional details about why the wire is being returned that will be included with the returned wire. Required when `reason` is `narrative`.
                  minLength: 1
                  maxLength: 105
                  pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
                amount:
                  $ref: '#/components/schemas/WireAmount'
                  description: The amount to be returned in cents. If not provided, the original wire amount will be used.
                metadata:
                  $ref: '#/components/schemas/Metadata'
      responses:
        '200':
          description: The new outgoing return wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireV2'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: You do not have permission to access this wire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: wire_id passed in is not a valid wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: We couldn't parse your request body, please check that your request body is valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v2/wires/{wire_id}/request_return:
    post:
      tags:
      - Wire
      operationId: request-return-for-wire-v2
      summary: Request return for a wire V2
      description: Create a return request for a previously sent outgoing wire.
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key
        required: true
        schema:
          type: string
          maxLength: 255
      - name: wire_id
        description: ID of the wire object you want to request a return for. Must be an outgoing transfer or return wire in `posted` status that has not been fully returned.
        example: wire_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^wire_\w+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  $ref: '#/components/schemas/WireOutgoingReturnRequestReason'
                additional_information:
                  type: string
                  description: Accompanying free-text explanation for the reason. Required when `reason` is `narrative`, `wrong_amount`, or `service_not_rendered`.
                  minLength: 1
                  maxLength: 105
                  pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
      responses:
        '200':
          description: The updated wire object, with the new return request in the `return_requests` array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireV2'
        '403':
          description: You do not have permission to access this wire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: wire_id passed in is not a valid wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: Your request parameters did not validate. The wire may not be eligible for a return request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v2/wires/{wire_id}/reject_return_request:
    post:
      tags:
      - Wire
      operationId: reject-return-request-for-wire-v2
      summary: Reject a return request for a wire V2
      description: Reject the currently active incoming return request associated with the wire.
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key
        required: true
        schema:
          type: string
          maxLength: 255
      - name: wire_id
        description: ID of the wire object whose active return request you want to reject.
        example: wire_xyz001
        in: path
        required: true
        schema:
          type: string
          pattern: ^wire_\w+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  $ref: '#/components/schemas/WireReturnRequestRejectionReason'
                additional_information:
                  type: string
                  description: Accompanying free-text explanation for the reason. Required when `reason` is `narrative`.
                  minLength: 1
                  maxLength: 105
                  pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
      responses:
        '200':
          description: The updated wire object, with the active return request now in `rejected` status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireV2'
        '403':
          description: You do not have permission to access this wire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: wire_id passed in is not a valid wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: Your request parameters did not validate. There may be no active return request associated with this wire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
components:
  schemas:
    WireAgentRequest:
      type: object
      description: Wire agent information.
      properties:
        routing_number:
          type: string
          description: Nine-character numeric ABA routing number of the financial institution.
          minLength: 9
          maxLength: 9
          pattern: ^[0-9]+$
          example: '021000021'
        business_identifier_code:
          type:
          - string
          - 'null'
          description: Business Identifier Code (BIC) of the financial institution. Required for international wires.
          minLength: 8
          maxLength: 11
          pattern: ^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$
          example: CHASUS33
        local_routing_identifier:
          $ref: '#/components/schemas/LocalRoutingIdentifierRequest'
    WireCreditorRequestV2:
      type: object
      description: The person or entity to which the wire is being sent.
      required:
      - name
      - account_identifier
      - address
      properties:
        name:
          type: string
          description: Name of the person or entity to which the wire is being sent.
          minLength: 3
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
          example: Example Beneficiary Inc.
        account_identifier:
          type: object
          description: Account identifier of the creditor.
          required:
          - type
          - value
          properties:
            type:
              type: string
              description: Indicator for the type of account identifier to which the wire is being sent.
              enum:
              - account_number
              - IBAN
              example: account_number
            value:
              type: string
              description: The value associated with the account identifier to which the wire is being sent.
              minLength: 1
              maxLength: 34
              pattern: ^[a-zA-Z0-9 ]*[a-zA-Z0-9]+$
              example: GB29NWBK60161331926819
        address:
          description: Postal address of the creditor.
          $ref: '#/components/schemas/WirePostalAddressRequestV2'
    APIError:
      type: object
      properties:
        code:
          type: string
          description: The error code.
        title:
          type: string
          description: The error title.
        detail:
          type: string
          description: A detailed error description.
        status:
          type: string
          description: The HTTP status code.
        invalid_parameters:
          type: array
          description: Invalid request parameters with reasons, if applicable.
          items:
            $ref: '#/components/schemas/InvalidParameterDetail'
        instance:
          type: string
          description: The object causing this specific occurrence of the error, if applicable.
    WireChargeInfo:
      type: object
      description: Details of a single charge assessed during wire transfer processing.
      required:
      - amount
      - currency_code
      properties:
        amount:
          type: string
          description: The amount of the charge.
          example: '12.50'
        currency_code:
          type: string
          description: ISO 4217 three-letter currency code for the charge.
          example: USD
        charging_agent:
          $ref: '#/components/schemas/WireAgent'
    WireReturnRequest:
      type: object
      description: A return request associated with a wire.
      required:
      - created_at
      - status
      - reason
      properties:
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the return request was created.
          example: '2024-06-27T12:15:00Z'
        status:
          $ref: '#/components/schemas/WireReturnRequestStatus'
        reason:
          $ref: '#/components/schemas/WireReturnRequestReason'
        details:
          type: string
          description: Details of the reason for the return request including the 4-character ISO code when possible.
          maxLength: 1000
          example: suspected unauthorized activity
        deadline:
          type: string
          format: date-time
          description: 'The deadline by which a final response to the return request is expected.

            For incoming return requests, you must respond by 11:30PM ET on the 10th business day. If you do not respond, we will respond on your behalf with a rejection at midnight.

            For outgoing return requests, this field will not be populated.'
          example: '2024-07-08T23:30:00Z'
        resolution:
          $ref: '#/components/schemas/WireReturnRequestResolution'
    WireParty:
      type: object
      description: Wire party information.
      properties:
        name:
          type: string
          description: Name of the party.
          example: Alan Scott
        account_identifier:
          $ref: '#/components/schemas/WirePartyAccountIdentifier'
        address:
          description: Address of the party.
          $ref: '#/components/schemas/WirePostalAddress'
    WireReturnCode:
      type: string
      description: 'List of eligible return reason codes for wire transfers.

        * `AC06` - account_blocked

        * `AM09` - wrong_amount

        * `BE01` - creditor_name_mismatch

        * `FOCR` - honor_return_request

        * `FR01` - fraud_suspected

        * `MS02` - creditor_request

        * `NARR` - narrative

        * `RR02` - missing_debtor_data

        * `RR03` - missing_creditor_data'
      example: AC06
      enum:
      - AC06
      - AM09
      - BE01
      - FOCR
      - FR01
      - MS02
      - NARR
      - RR02
      - RR03
    AccountID:
      type: string
      description: The ID of the Account object.
      example: account_xyz123
      pattern: ^account_\w+$
    WireReturnReasonV2:
      type: string
      description: The reason for returning the wire.
      example: creditor_request
      enum:
      - account_blocked
      - wrong_amount
      - creditor_name_mismatch
      - honor_return_request
      - fraud_suspected
      - creditor_request
      - narrative
      - missing_debtor_data
      - missing_creditor_data
    WireCreditorRequest:
      type: object
      description: The person or entity to which the wire is being sent.
      required:
      - name
      - account_identifier
      - address
      properties:
        name:
          type: string
          description: Name of the person or entity to which the wire is being sent.
          minLength: 3
          maxLength: 35
          pattern: ^[ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*[\w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]][ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*$
          example: Allan Scott
        account_identifier:
          type: object
          description: Account identifier of the creditor.
          required:
          - type
          - value
          properties:
            type:
              type: string
              description: Indicator for the type of account identifier to which the wire is being sent.
              enum:
              - account_number
              - IBAN
              example: account_number
            value:
              type: string
              description: The value associated with the account identifier to which the wire is being sent.
              minLength: 1
              maxLength: 34
              pattern: ^[a-zA-Z0-9 ]*[a-zA-Z0-9]+$
              example: '1032345678'
        address:
          description: Address of the creditor.
          $ref: '#/components/schemas/WirePostalAddressRequest'
    WireAmount:
      description: The amount of the wire transaction in cents.
      type: integer
      format: int64
      example: 5000
      minimum: 1
      maximum: 990000000000
    WireChargeInfoV2:
      type: object
      description: Details of a single charge assessed during wire transfer processing.
      required:
      - amount
      - currency_code
      properties:
        amount:
          type: string
          description: The amount of the charge.
          example: '12.50'
        currency_code:
          type: string
          description: ISO 4217 three-letter currency code for the charge.
          example: USD
        charging_agent:
          $ref: '#/components/schemas/WireAgentV2'
    WireAmounts:
      type: object
      properties:
        settlement_amount:
          $ref: '#/components/schemas/WireAmount'
          description: Amount of money that moved across the Fedwire network from the instructing agent to the instructed agent.
        settlement_currency_code:
          $ref: '#/components/schemas/CurrencyCode'
          description: The currency code of the settlement amount.
        instructed_amount:
          $ref: '#/components/schemas/WireAmount'
          description: Amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party.
        instructed_currency_code:
          type: string
          description: The currency code of the instructed amount. A three-letter currency code as defined in ISO 4217.
        instructed_to_settlement_exchange_rate:
          description: Factor used to convert an amount from the instructed currency to the settlement currency.
          type: string
          example: 1
    WireRemittanceDetails:
      type: object
      description: Wire remittance details.
      properties:
        payment_notification:
          type: string
          readOnly: true
          description: Information about the payment notification.
          example: ba77ae30-efb8-4139-8e51-37e3fd905b2b
        message_to_creditor:
          type: string
          description: Information intended specifically for the creditor.
          example: Payment for invoice 12345
          maxLength: 140
          pattern: ^[ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]\n]*$
        message_to_receiving_fi:
          type: string
          readOnly: true
          description: Information intended specifically for the receiving financial institution.
          example: message for receiving financial institution
        fi_to_fi_message:
          type: string
          readOnly: true
          description: Financial institution to financial institution information, most often used by a financial institution to explain additional detail of a wire.
          example: message from financial institution to financial institution
        transfer_purpose:
          $ref: '#/components/schemas/WireTransferPurposeV1'
    WireChargesV2:
      type: object
      description: Information about charges associated with the wire transfer.
      properties:
        charge_bearer:
          $ref: '#/components/schemas/WireChargeBearer'
          description: Specifies which party bears the charges for the wire transfer.
        breakdown:
          type: array
          description: Itemized list of charges assessed during wire transfer processing.
          items:
            $ref: '#/components/schemas/WireChargeInfoV2'
    WireRejectionReasonV1:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/WireRejectionReasonEnum'
          description: If a wire is rejected, this field will indicate the reason for the rejection.
        additional_information:
          type: string
          description: If the rejection reason is “narrative”, then an accompanying free-form explanation is required and will appear here. For other reasons, participants may optionally send additional information as well.
        message_identification:
          $ref: '#/components/schemas/IMAD'
          description: If Lead rejected an incoming wire on your behalf, this field contains the message identification (formerly known as imad) of the return wire that we sent.
    WireOtherAgentsV2:
      description: Details of any other agents involved in the wire transfer.
      type: object
      properties:
        previous_instructing_agent_one:
          $ref: '#/components/schemas/WireAgentV2'
          description: Financial institution sitting in the payment chain between the Debtor Agent and the Instructing Agent.
        previous_instructing_agent_two:
          $ref: '#/components/schemas/WireAgentV2'
          description: Financial institution sitting in the payment chain between the Debtor Agent and the Instructing Agent.
        previous_instructing_agent_three:
          $ref: '#/components/schemas/WireAgentV2'
          description: Financial institution sitting in the payment chain between the Debtor Agent and the Instructing Agent.
        intermediary_agent_one:
          $ref: '#/components/schemas/WireAgentV2'
          description: Financial institution sitting in the payment chain between the Creditor Agent and the Instructed Agent.
        intermediary_agent_two:
          $ref: '#/components/schemas/WireAgentV2'
          description: Financial institution sitting in the payment chain between the Creditor Agent and the Instructed Agent.
        intermediary_agent_three:
          $ref: '#/components/schemas/WireAgentV2'
          description: Financial institution sitting in the payment chain between the Creditor Agent and the Instructed Agent.
    WireReturnRequestRejectionReason:
      type: string
      description: 'Reason the return request was rejected.


        - `account_closed` — ISO `AC04`.

        - `non_sufficient_funds` — ISO `AM04`.

        - `customer_requested` — ISO `CUST`. Customer declined the return.

        - `legal_decision` — ISO `LEGL`.

        - `customer_no_response` — ISO `NOAS`. Customer did not respond by the deadline.

        - `returned_previously` — ISO `ARDT`. Wire already fully returned. Auto-set by Lead when applicable.

        - `narrative` — ISO `NARR`. Catch-all; details field carries the explanation.

        - `per_agent_request` — ISO `AGNT`. Incoming only.

        - `other` — Incoming only. Catch-all for unmapped ISO codes received from the counterparty.'
      enum:
      - account_closed
      - non_sufficient_funds
      - customer_requested
      - legal_decision
      - customer_no_response
      - returned_previously
      - narrative
      - per_agent_request
      - other
    WireDirection:
      type: string
      description: 'Who is initiating the transaction.


        outgoing: You are sending a wire transaction to a counterparty.

        incoming: You are receiving an wire transaction from a counterparty.'
      example: incoming
      enum:
      - outgoing
      - incoming
    WirePostalAddressRequest:
      type: object
      required:
      - line_one
      properties:
        line_one:
          type: string
          description: Line one address of the party represented in an unstructured format.
          minLength: 1
          maxLength: 35
          pattern: ^[ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*[\w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]][ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*$
          example: 123 Main St
        line_two:
          type: string
          description: Line two address of the party represented in an unstructured format.
          maxLength: 35
          pattern: ^[ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*$
          example: Suite 100
        line_three:
          type: string
          description: Line three address of the party represented in an unstructured format.
          maxLength: 35
          pattern: ^[ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*$
          example: Kansas City, MO 64105
    LocalRoutingIdentifier:
      type: object
      description: Routing or transit code used by the financial institution's local clearing system for international wire transfers, such as a sort code, IFSC, or BSB.
      properties:
        scheme:
          type: string
          description: The scheme or type of the local routing identifier (e.g. GBDSC for UK sort codes).
          example: GBDSC
        value:
          type: string
          description: The value of the local routing identifier.
          minLength: 1
          maxLength: 35
          example: '123456'
    WireRejectionReasonEnum:
      type: string
      description: Reason to return a wire payment.
      example: honor_return_request
      enum:
      - account_blocked
      - account_closed
      - account_number_incorrect
      - amount_blocked
      - creditor_account_number_invalid
      - creditor_address_incorrect
      - creditor_name_mismatch
      - creditor_request
      - debtor_address_invalid
      - honor_return_request
      - narrative
      - per_agent_request
      - non_sufficient_funds
      - regulatory_reason
      - routing_number_format_incorrect
      - aggregate_limit_exceeded
    WireTransferPurposeV1:
      type: object
      description: The purpose or reason for which the wire is being sent.
      required:
      - type
      properties:
        type:
          description: Code representing the purpose of the transfer.
          type: string
          enum:
          - salary_payment
          - invoice_payment
          - gift
          - payment_for_goods
          - payment_for_services
          - insurance_premium_payment
          - interest_payment
          - loan
          - loan_repayment
          - account_management
          - cash_management_transfer
          - tax_payment
          - government_payment
          - benefits_payment
          - pension_payment
          - rent_payment
          - utilities_payment
          - education_payment
          - healthcare_payment
          - charitable_payment
          - refund
          - fee_payment
          - intercompany_transfer
          - investment_payment
          - fx_or_treasury
          - derivatives_payment
          - card_network_settlement
          - other
          example: invoice_payment
        other_details:
          type: string
          description: Free-formatted text for wire sender if `other` is selected for `type`.
          minLength: 3
          maxLength: 140
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*[0-9a-zA-Z/\-\?:\(\)\.,'\+!@#$%^&\*=_`\{\|\}~";<>\[\\\]][0-9a-zA-Z/\-\?:\(\)\.,'\+ !@#$%^&\*=_`\{\|\}~";<>\[\\\]]*$
          example: Payment for consulting services
    WireReturnRequestStatus:
      type: string
      description: 'Current status of the return request.


        - For incoming return requests: `response_needed`, `accepted`, `rejected`.

        - For outgoing return requests: `pending`, `accepted`, `rejected`.


        `accepted` and `rejected` are terminal.'
      enum:
      - response_needed
      - pending
      - accepted
      - rejected
    LocalRoutingIdentifierRequest:
      type: object
      description: Routing or transit code used by the creditor agent's local clearing system for international wire transfers, such as a sort code, IFSC, or BSB. This field may be required for certain destinations.
      properties:
        value:
          type: string
          description: The value of the local routing identifier.
          minLength: 1
          maxLength: 35
          example: '123456'
    Metadata:
      type: object
      additionalProperties:
        type: string
      description: A set of key-value pairs that can be used to store additional information related to this object.
    WirePaymentIdentifiers:
      type: object
      description: Wire payment identifiers.
      properties:
        message_identification:
          type: string
          readOnly: true
          description: Point to point reference, as assigned by the instructing party, and sent to the next party in the chain to unambiguously identify the message..
          example: 20241215MMQFMP2L017736
        end_to_end_identification:
          type: string
          description: Unique identification that the initiating party in a wire message can use to unambiguously identify the transaction. This is passed through, unchanged, throughout the entire wire chain.
          maxLength: 35
          pattern: ^[ \w/\-\?:\(\)\.,'\+!@#$%^&\*=`\{\|\}~";<>\[\\\]]*$
          example: EndtoEnd12345
        uetr:
          type: string
          readOnly: true
          description: Universally unique identifier to provide an end-to-end reference of a payment transaction.
          format: uuid
          example: dae7d83c-1624-4a79-a8ef-3794de115c13
        instruction_identification:
          type: string
          readOnly: true
          description: Unique identification, as assigned by an instructing party for an instructed party, to unambiguously identify the instruction.
          example: Instruction12345
        return_identification:
          type: string
          readOnly: true
          description: Unique identification, as assigned by an instructing party for an instructed party, to unambiguously identify the returned transaction.
          example: ReturnInstruction12345
    WirePartyAccountIdentifier:
      type: object
      description: Object representing the account that the party holds at its financial institution
      properties:
        type:
          type: string
          description: The type of account identifier.
          example: other
          enum:
          - other
          - IBAN
        value:
          type: string
