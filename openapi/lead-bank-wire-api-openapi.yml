        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAWireRequestBodyV2'
      responses:
        '200':
          description: The new outgoing wire object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireV2'
        '400':
          description: Your request parameters did not validate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: You do not have permission to access this account.
          content:
